name: Build & attach exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the exe to (e.g. v1.0.0)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build winotch.exe + NSIS installer
        # The frontend is plain HTML/CSS/JS (webview/ui) — no npm build step.
        # npm exec pulls the prebuilt Tauri v2 CLI; run from webview/ where
        # src-tauri lives. --bundles nsis produces the setup exe too
        # (bundle.targets = nsis in tauri.conf.json).
        working-directory: webview
        run: npm exec --yes --package @tauri-apps/cli@^2 -- tauri build --bundles nsis

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach exe + installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" webview/src-tauri/target/release/winotch.exe --clobber
          gh release upload "$TAG" webview/src-tauri/target/release/bundle/nsis/*-setup.exe --clobber