name: build-test-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      EnableWindowsTargeting: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Winotch/Winotch.csproj -p:TargetFramework=net8.0-windows10.0.19041.0

      - name: Build
        run: dotnet build src/Winotch/Winotch.csproj -c Release --no-restore -p:TargetFramework=net8.0-windows10.0.19041.0

      - name: Restore tests
        run: dotnet restore tests/Winotch.Tests/Winotch.Tests.csproj

      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet test tests/Winotch.Tests/Winotch.Tests.csproj -c Release --no-restore

      - name: Publish portable exe
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet publish src/Winotch/Winotch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFramework=net8.0-windows10.0.19041.0 -o publish

      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath "Winotch-${{ github.ref_name }}-x64.zip"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "Winotch-${{ github.ref_name }}-x64.zip" --clobber


  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Winotch/Winotch.csproj -p:TargetFramework=net8.0

      - name: Build
        run: dotnet build src/Winotch/Winotch.csproj -c Release --no-restore -p:TargetFramework=net8.0

      - name: Publish portable Linux executable
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet publish src/Winotch/Winotch.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:TargetFramework=net8.0 -o publish

      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/')
        run: zip -j "Winotch-${{ github.ref_name }}-linux-x64.zip" publish/*

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "Winotch-${{ github.ref_name }}-linux-x64.zip" --clobber
