[package]
name = "winotch-native"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", features = ["component", "network"] }
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tray-icon = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Devices_Geolocation",
] }

[profile.release]
strip = true
lto = "thin"
