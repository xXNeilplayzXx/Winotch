        ? "linear-gradient(180deg, rgba(248, 250, 253, 0.9), rgba(240, 243, 248, 0.94))"
        : "linear-gradient(180deg, rgba(21, 26, 36, 0.86), rgba(13, 17, 25, 0.92))";
      foot.style.backgroundImage = `${g}, ${base}`;
    }
  }
  // Factory reset: two-step tap-to-confirm so the destructive op can't fire
  // from a stray click. Any deck re-render replaces this node and disarms it.
  const factory = h("button", "text-btn danger", "Factory reset…");
  let factoryArmed = false, factoryTimer = null;
  factory.onclick = () => {
    if (!factoryArmed) {
      factoryArmed = true;
      factory.classList.add("armed");
      factory.textContent = "Tap again — wipe everything?";
      factoryTimer = setTimeout(() => {
        factoryArmed = false;
        factory.classList.remove("armed");
        factory.textContent = "Factory reset…";
      }, 3500);
      return;
    }
    clearTimeout(factoryTimer);
    factoryReset();
  };
  const toDefault = h("button", "text-btn", "Reset to default");
  toDefault.onclick = () => {
    Object.assign(state, defaults());
    draft = snapshot();
    persist();
    state.dial = { call: false, mic: false, playing: false };
    state.editing = null; state.addOpen = false;
    wxLive = null;
    render();
  };
  const actions = h("div", "deck-foot-actions");
  const reset = h("button", "btn ghost", "Reset");
  reset.onclick = () => { draft = snapshot(); render(); };
  const cancel = h("button", "btn", "Cancel");
  cancel.onclick = () => collapsePanel();
  const apply = h("button", "btn primary" + (state.applied ? " bump" : ""), state.applied ? "Applied ✓" : "Apply");
  apply.id = "applyBtn";
  apply.disabled = !state.dirty;
  // Which draft fields each settings section owns — used to acknowledge an
  // Apply by flaring exactly the sections whose values actually change.
  const APPLY_FIELDS = {
    shape: ["shape"],
    size: ["size"],
    appearance: ["glass", "frosted", "gradient", "opacity", "blur"],
    theme: ["theme", "accent"],
    idle: ["idleContent", "idleText"],
    widgets: ["widgets", "widgetOrder", "sysMetrics"],
  };
  apply.onclick = () => {
    // Snapshot the LIVE values about to be replaced — not the draft (which is
    // by definition what gets committed) — plus the live widget stack, so the
    // commit can be acknowledged per-row instead of silently.
    const prevLive = {
      shape: state.shape, size: { ...state.size }, glass: state.glass, frosted: state.frosted,
      gradient: state.gradient, opacity: state.opacity, blur: state.blur,
      theme: state.theme, accent: state.accent, idleContent: state.idleContent, idleText: state.idleText,
      widgets: { ...state.widgets }, widgetOrder: [...state.widgetOrder], sysMetrics: { ...state.sysMetrics },
    };
    const prevSet = widgetEnabledOrder();
    const prevWidgets = { ...state.widgets };
    Object.assign(state, JSON.parse(JSON.stringify(draft)));
    persist();
    const nowSet = widgetEnabledOrder();
    const changed =
      prevSet.some((t) => !state.widgets[t]) ||           // something removed
      nowSet.some((t) => !prevWidgets[t]) ||             // something added
      JSON.stringify(prevSet) !== JSON.stringify(nowSet); // order shifted
    if (changed) widgetGhost = { types: prevSet, added: nowSet.filter((t) => !prevWidgets[t]) };
    state.dirty = false;
    state.applied = true;
    render();
    // Acknowledge the commit: any section whose live value actually changed
    // flares its rows (staggered) and pulses its marker — the visual "this is
    // what just landed". Sections the user staged and then staged back stay
    // calm, because their draft value already matched the live one.
    const changedSecs = new Set();
    for (const [sec, fields] of Object.entries(APPLY_FIELDS)) {
      if (fields.some((f) => JSON.stringify(prevLive[f]) !== JSON.stringify(state[f]))) changedSecs.add(sec);
    }
    if (changedSecs.size) {
      const freshScroll = document.querySelector("#deck .deck-scroll");
      if (freshScroll) {
        freshScroll.querySelectorAll(".section").forEach((secEl) => {
          if (!changedSecs.has(secEl.dataset.key)) return;
          secEl.classList.add("applied-flash");
          secEl.querySelectorAll(".row").forEach((r, i) => {
            // In the widgets section only the toggles that actually flipped
            // flare — the section's marker still pulses as a whole.
            if (secEl.dataset.key === "widgets") {
              const w = r.querySelector("[data-widget]");
              const m = r.querySelector("[data-metric]");
              const wHit = w && prevLive.widgets[w.dataset.widget] !== state.widgets[w.dataset.widget];
              const mHit = m && prevLive.sysMetrics[m.dataset.metric] !== state.sysMetrics[m.dataset.metric];
              if (!wHit && !mHit) return;
            }
            r.classList.add("row-flash");
            r.style.animationDelay = (i * 40) + "ms";
          });
        });
      }
    }
    setTimeout(() => { state.applied = false; render(); }, 1400);
  };
  actions.append(reset, cancel, apply);
  const footLeft = h("div", "deck-foot-left");
  footLeft.append(toDefault, factory);
  foot.append(footLeft, actions);
  wrap.appendChild(foot);

  // Fresh mount: cascade the tip, then the section cards, downward from the
  // top anchor with a springy settle each (see .tip-reveal / .deck-reveal).
  // Only on the mount draw — deckFreshMount is cleared here so re-renders
  // (staging, sliders) are calm.
  if (deckFreshMount) {
    deckFreshMount = false;
    const tip = wrap.querySelector(".settings-tip");
    if (tip) {
      tip.classList.add("tip-reveal");
      tip.style.animationDelay = "20ms";
    }
    scroll.querySelectorAll(".section").forEach((s, i) => {
      s.classList.add("reveal");
      s.style.animationDelay = (60 + i * 32) + "ms";
    });
  }

  // Give every control its handler synchronously, scoped to this deck — the
  // deck isn't attached to the document yet, so a document-wide query would
  // find nothing. (The old requestAnimationFrame(wireDeck) worked only by
  // accident: by then the deck was attached, but under throttled rAF the
  // controls stayed dead for a frame or longer.)
  wireDeck(wrap);
  return wrap;
}

function defaults() {
  return {
    shape: "notch", theme: "dark", accent: "#4fc3ff", glass: true, frosted: false, opacity: 65, blur: 14,
    gradient: "none", size: { width: 330, height: 36 }, idleContent: "brand", idleText: "",
    widgets: { ...DEFAULT_WIDGETS }, widgetOrder: [...DEFAULT_ORDER],
    sysMetrics: { cpu: true, temp: true, mem: true, bat: true, net: true },
    notes: "", weather: { city: "Set your location", lat: null, lon: null }, launcherApps: QUICK_APPS.slice(),
  };
}

function section(key, title, sub, summary, bodyHtml) {
  const sec = h("div", "section" + (state.openSections[key] ? " open" : ""));
  sec.dataset.key = key;
  const head = h("button", "section-head");
  head.innerHTML = `<span class="section-mark" aria-hidden></span>
    <span class="section-titles"><span class="section-title">${title}</span><span class="section-sub">${sub}</span></span>
    ${summary ? `<span class="section-summary">${esc(summary)}</span>` : ""}
    <span class="section-chevron" aria-hidden>›</span>`;
  head.onclick = () => { state.openSections[key] = !state.openSections[key]; render(); };
  const b = h("div", "section-body", bodyHtml);
  sec.append(head, b);
  if (!state.openSections[key]) b.style.display = "none";
  return sec;
}

/* ---------- deck wiring (runs synchronously, scoped to the deck element) ---------- */
function wireDeck(root) {
  const q = (s) => root.querySelector(s);
  const qa = (s) => Array.from(root.querySelectorAll(s));
  const d = () => draft;

  const drag = q("#stDrag");
  if (drag) drag.onclick = () => {
    if (SETTINGS_VIEW) {
      // The pill lives in the notch window — close settings and start the
      // arrange session there (winotch://arrange is listened for on main).
      closeSettingsWindow();
      if (TAURI) TAURI.event.emit("winotch://arrange").catch(() => {});
      return;
    }
    // Collapse into the slim pill and start an arrange session: the strip now
    // shows Reset/Done, and the island follows the pointer until one is pressed.
    state.arrangeOrigin = { ...state.pos };
    state.expanded = false;
    state.settingsOpen = false;
    state.arranging = true;
    render();
  };
  qa("[data-pos]").forEach((b) => b.onclick = () => { setPos(b.dataset.pos); });

  const rerun = q("#stRerun");
  if (rerun) rerun.onclick = () => openSetup();

  // Display picker — real monitor enumeration under Tauri; picking one moves
  // the notch window there (backend command) and persists the choice.
  const displayChips = q("#displayChips");
  if (displayChips) {
    if (!TAURI) {
      // Browser/preview has no monitor bridge — show a static label instead
      // of crashing the whole settings deck on TAURI.core.
      displayChips.innerHTML = '<span class="value" style="color:var(--text-3)">Main monitor</span>';
    } else {
      TAURI.core.invoke("get_monitors").then((mons) => {
        if (!mons || !mons.length) { displayChips.innerHTML = '<span class="value">Main monitor</span>'; return; }
        const saved = store.load("display", "primary");
        displayChips.innerHTML = mons.map((m) => {
          const id = m.is_primary ? "primary" : m.device;
          const label = (m.is_primary ? "Main" : (m.name || m.device).split(" ")[0]) +
            ` <small>${m.width}×${m.height}</small>`;
          return `<button class="chip ${saved === id ? "on" : ""}" data-mon="${esc(id)}">${label}</button>`;
        }).join("");
        displayChips.querySelectorAll("[data-mon]").forEach((b) => {
          b.onclick = () => {
            const id = b.dataset.mon;
            store.save("display", id);
            TAURI.core.invoke("move_notch_to_monitor", { monitorName: id === "primary" ? "primary" : id }).catch(() => {});
            displayChips.querySelectorAll("[data-mon]").forEach((x) => x.classList.toggle("on", x === b));
          };
        });
      }).catch(() => { displayChips.innerHTML = '<span class="value">Main monitor</span>'; });
    }
  }

  qa("[data-shape]").forEach((b) => b.onclick = () => { d().shape = b.dataset.shape; markDirty(); render(); });
  qa("[data-glass]").forEach((b) => b.onclick = () => {
    const v = b.dataset.glass;
    d().glass = v !== "0";
    d().frosted = v === "2";
    markDirty(); render();
  });
  qa("[data-grad]").forEach((b) => b.onclick = () => { d().gradient = b.dataset.grad; markDirty(); render(); });
  qa("[data-theme-pick]").forEach((b) => b.onclick = () => { d().theme = b.dataset.themePick; markDirty(); render(); });
  qa("[data-accent]").forEach((b) => b.onclick = () => { d().accent = b.dataset.accent; markDirty(); render(); });
  qa("[data-widget]").forEach((b) => b.onclick = () => {
    const t = b.dataset.widget;
    d().widgets[t] = !d().widgets[t];
    if (d().widgets[t]) { if (!d().widgetOrder.includes(t)) d().widgetOrder.push(t); }
    else d().widgetOrder = d().widgetOrder.filter((x) => x !== t);
    markDirty(); render();
  });
  qa("[data-preset]").forEach((b) => b.onclick = () => { d().size.width = Number(b.dataset.preset); markDirty(); render(); });
  qa("[data-metric]").forEach((b) => b.onclick = () => { d().sysMetrics[b.dataset.metric] = !d().sysMetrics[b.dataset.metric]; markDirty(); render(); });

  const nsTrig = q("[data-ns-trigger]");
  if (nsTrig) {
    nsTrig.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleNotchSelect(e.currentTarget, (v) => { d().idleContent = v; markDirty(); render(); });
    });
    // keyboard: open with arrows/Enter/Space
    nsTrig.addEventListener("keydown", (e) => {
      if (["ArrowDown", "ArrowUp", " ", "Enter"].includes(e.key)) {
        e.preventDefault();
        toggleNotchSelect(e.currentTarget, (v) => { d().idleContent = v; markDirty(); render(); });
      }
    });
  }
  const idleText = q("#stIdleText");
  if (idleText) idleText.oninput = () => { d().idleText = idleText.value; markDirty(); };

  const width = q("#stWidth");
  if (width) width.oninput = () => {
    d().size.width = Number(width.value);
    const val = q("#stWidthVal");
    if (val) val.textContent = width.value + "px";
    // live preview the idle width immediately
    state.size.width = d().size.width;
    applyIslandSize();
    markDirty();
  };
  const op = q("#stOp");
  if (op) op.oninput = () => {
    d().opacity = Number(op.value);
    const val = q("#stOpVal");
    if (val) val.textContent = op.value + "%";
    state.opacity = d().opacity; applyTheme();
  };
  const blur = q("#stBlur");
  if (blur) blur.oninput = () => {
    d().blur = Number(blur.value);
    const val = q("#stBlurVal");
    if (val) val.textContent = blur.value + "px";
    state.blur = d().blur; applyTheme();
  };
  const color = q("#stColor");
  if (color) color.oninput = () => {
    d().accent = color.value;
    // Live-render the accent like the sliders (NO full render): rebuilding the
    // deck on every input event would destroy the picker mid-drag and teleport
    // the view on every frame of the drag.
    state.accent = color.value;
    applyTheme();
    markDirty();
  };

  const sysAccent = q("#stAccentSys");
  if (sysAccent) sysAccent.onclick = () => {
    // Follow the REAL Windows accent color (live-updated via winotch://theme).
    d().accent = "system";
    markDirty(); render();
  };

}

/* Current value for each settings section, shown on its header so closed
   sections still tell you what they configure (and what's currently set). */
function sectionSummary(key) {
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  switch (key) {
    case "general": {
      const names = { default: "Default", left: "Left edge", right: "Right edge", custom: "Custom" };
      return "Position · " + (names[state.pos.mode] || "Custom");
    }
    case "shape": return state.shape === "notch" ? "Notch" : "Pill";
    case "size": return state.size.width + "px";
    case "appearance": {
      const s = !state.glass ? "Solid" : state.frosted ? "Frosted" : "Glass";
      return state.gradient !== "none" ? s + " · " + cap(state.gradient) : s;
    }
    case "theme": return cap(state.theme);
    case "idle": {
      const names = {
        brand: "Brand + clock", clock: "Clock only",
        custom: state.idleText ? "Custom text" : "Custom",
        system: "System stats", blank: "Dot only",
      };
      return names[state.idleContent] || "";
    }
    case "widgets": return Object.values(state.widgets).filter(Boolean).length + "/" + WIDGET_TYPES.length + " on";
    default: return "";
  }
}

function markDirty() {
  state.dirty = isDirty();
  const apply = $("#applyBtn");
  if (apply) apply.disabled = !state.dirty;
}

// Deferred close: the mirror of the gravity-cascade open. The deck (and any
// open widgets view) gets inhaled upward into the top anchor — fade + rise +
// blur, same language as deck-reveal but reversed — while the pill's height
// spring runs down to 36px at the same time. The render swap happens after
// the exit animation so nothing is wiped mid-motion. Interactions are locked
// out while closing so a stray hover/click can't fight the animation.
let closeTimer = null;
function collapsePanel() {
  if (SETTINGS_VIEW) { closeSettingsWindow(); return; } // deck Cancel = close
  if (!state.expanded) return;
  if (closeTimer) return; // already closing
  const island = $("#island");
  island.classList.add("closing");
  island.style.pointerEvents = "none";
  // Exit stagger, top card first: the entrance delays (60 + i*32ms) would hold
  // later cards at opacity 1 past the swap, so override them for the exit.
  // Last card finishes at ~(n-1)*24 + 240ms; the swap waits for that.
  // Clear every inline entrance delay (head/tip set none, but sections and the
  // widgets deck set 60 + i*32ms on mount; the tip sets 20ms) so the exit
  // stagger below is the only timing in play.
  island.querySelectorAll("*[style*='animation-delay']").forEach((el) => { el.style.animationDelay = ""; });
  const exiters = island.querySelectorAll(".section, .widget");
  exiters.forEach((el, i) => { el.style.animationDelay = (i * 24) + "ms"; });
  // Start the pill shrink immediately — the CSS transition springs it from the
  // content height down to the 36px collapsed strip while the deck exits.
  island.style.height = "36px";
  island.style.borderRadius = state.shape === "notch" ? "0 0 22px 22px" : "999px";
  // Reduced motion: exit animations collapse to ~0 via CSS, so swap at once.
  // Under Tauri we force animations on, so this is always false in the app and
  // the full collapse spring plays out.
  const reduce = false; // the app always plays every animation
  closeTimer = setTimeout(() => {
    closeTimer = null;
    island.classList.remove("closing");
    island.style.pointerEvents = "";
    state.expanded = false;
    state.settingsOpen = false;
    state.addOpen = false;
    state.editing = null;
    render();
  }, reduce ? 10 : 400 + exiters.length * 24); // cover stagger + 0.26s deck-exit, overlap the 0.42s height spring
}

/* ---------- context menu ---------- */
function openCtx(x, y) {
  const menu = $("#ctx");
  menu.innerHTML = "";
  const item = (label, danger, fn) => {
    const b = h("button", "ctx-item" + (danger ? " danger" : ""), label);
    b.onclick = () => { menu.hidden = true; fn(); };
    return b;
  };
  menu.append(
    // Hide parks the island in the system tray, Restart relaunches the exe,
    // Close quits the process — all real backend commands.
    item("Hide Winotch", false, () => {
      hideIsland();
      if (TAURI) TAURI.core.invoke("hide_island").catch(() => {});
    }),
    item("Restart Winotch", false, () => {
      if (TAURI) TAURI.core.invoke("restart_app").catch(() => {});
      else location.reload();
    }),
    item("Rerun Setup…", false, () => { state.settingsOpen = false; state.expanded = true; render(); openSetup(); }),
    item("Close Winotch", true, () => {
      if (TAURI) TAURI.core.invoke("quit_app").catch(() => {});
      else hideIsland();
    }),
  );
  menu.hidden = false;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(0, Math.min(x, window.innerWidth - r.width - 8)) + "px";
  menu.style.top = Math.max(0, Math.min(y, window.innerHeight - r.height - 8)) + "px";
}
function hideIsland() {
  state.expanded = false;
  state.settingsOpen = false;
  // The backend hides the OS window; the tray's Show item brings it back.
}

/* ---------- rerun setup modal ---------- */
let setupOpen = false;

function openSetup(mode = "rerun") {
  const wrap = $("#setupWrap");
  const modal = $("#setupModal");
  setupOpen = true;
  const fresh = mode === "fresh";
  const s = snapshot();
  const pick = { shape: s.shape, theme: s.theme, glass: s.glass, widgets: { ...s.widgets } };
  const draw = () => {
    const seg = (vals, cur, onpick) => vals.map(([id, lab]) =>
      `<button class="chip ${pick[cur] === id ? "on" : ""}" data-sp="${id}">${lab}</button>`).join("");
    modal.innerHTML = `
      <h1>${fresh ? "Set up Winotch" : "Rerun setup"}</h1>
      <p class="sub">${fresh
        ? "Everything is back to factory defaults. Pick how the island should look — you can change it any time from settings."
        : "Same wizard, quicker. Pick how the island should look — you can change it any time from settings."}</p>
      <h2>Quick presets</h2>
      <div class="setup-grid">
        <button class="setup-tile ${pick.shape==="notch"&&pick.glass&&pick.theme==="dark"?" on":""}" data-pre="classic">
          <span class="setup-preview notch"></span><strong>Classic Notch</strong><small>dark glass, carved in</small>
        </button>
        <button class="setup-tile ${pick.shape==="notch"&&!pick.glass?" on":""}" data-pre="solid">
          <span class="setup-preview notch" style="opacity:.5"></span><strong>Solid Notch</strong><small>opaque, no blur</small>
        </button>
        <button class="setup-tile ${pick.shape==="pill"&&pick.glass&&pick.theme==="light"?" on":""}" data-pre="light">
          <span class="setup-preview"></span><strong>Light Pill</strong><small>floating glass capsule</small>
        </button>
      </div>
      <h2>Theme</h2>
      <div class="setup-grid">${seg([["light","Light"],["dark","Dark"],["system","System"]], "theme", null)}</div>
      <h2>Type</h2>
      <div class="setup-grid">
        <button class="setup-tile ${pick.shape==="notch"?" on":""}" data-shp="notch"><span class="setup-preview notch"></span><strong>Notch</strong><small>carved into the top edge</small></button>
        <button class="setup-tile ${pick.shape==="pill"?" on":""}" data-shp="pill"><span class="setup-preview"></span><strong>Pill</strong><small>a floating capsule</small></button>
      </div>
      <h2>Feel</h2>
      <div class="setup-grid">
        <button class="setup-tile ${pick.glass?" on":""}" data-fl="glass"><strong>Glass</strong><small>blur + translucency</small></button>
        <button class="setup-tile ${!pick.glass?" on":""}" data-fl="solid"><strong>Solid</strong><small>flat and opaque</small></button>
      </div>
      <h2>Widgets</h2>
      <div class="setup-grid">
        ${WIDGET_TYPES.map((k) =>
          `<button class="setup-tile ${pick.widgets[k]?" on":""}" data-wz="${k}"><strong>${WIDGET_LABELS[k]}</strong></button>`).join("")}
      </div>
      <div class="setup-actions">
        <button class="btn ghost" id="stCancel">Cancel</button>
        <button class="btn primary" id="stGo" style="margin-left:auto">Get started</button>
      </div>`;
    modal._pick = pick;
    modal.querySelectorAll("[data-pre]").forEach((b) => b.onclick = () => {
      const p = b.dataset.pre;
      pick.shape = p === "light" ? "pill" : "notch";
      pick.glass = p !== "solid";
      pick.theme = p === "light" ? "light" : p === "solid" ? "system" : "dark";
      draw();
    });
    modal.querySelectorAll("[data-sp]").forEach((b) => b.onclick = () => { pick.theme = b.dataset.sp; draw(); });
    modal.querySelectorAll("[data-shp]").forEach((b) => b.onclick = () => { pick.shape = b.dataset.shp; draw(); });
    modal.querySelectorAll("[data-fl]").forEach((b) => b.onclick = () => { pick.glass = b.dataset.fl === "glass"; draw(); });
    modal.querySelectorAll("[data-wz]").forEach((b) => b.onclick = () => { pick.widgets[b.dataset.wz] = !pick.widgets[b.dataset.wz]; draw(); });
    $("#stCancel").onclick = () => closeSetup();
    $("#stGo").onclick = () => {
      Object.assign(state, { shape: pick.shape, theme: pick.theme, glass: pick.glass, widgets: pick.widgets });
      persist();
      draft = snapshot();
      // The boot sweep was suppressed on first launch (it would have played
      // behind the wizard) — re-arm it so the shine greets the pill now.
      if (fresh) bootSweep = true;
      closeSetup();
      render();
      // Fresh installs get the in-pill "hover or click" cue right after the
      // wizard closes; reruns already saw it (hintSeen persists).
      if (fresh && !SETTINGS_VIEW) maybeFirstHint();
    };
    // Natural-height measure: temporarily unclamped (the cap is re-applied
    // right after), so the OS window can be sized to the FULL wizard even on
    // the first draw — when the viewport is still the tiny boot window and a
    // pre-applied cap would clamp the measurement to it (the circular
    // viewport-unit bug this replaces).
    modal.style.maxHeight = "none";
  };
  draw();
  wrap.classList.add("open");
  // The modal now lays out at its natural size (no vh clamp), so the first
  // measure is already correct. Cap it to the measured natural height and fit
  // the OS window to the real box.
  requestAnimationFrame(() => {
    const natural = modal.scrollHeight;
    modal.style.maxHeight = (natural + 2) + "px"; // +2: avoid a rounding scrollbar
    syncWindow();
  });
  setTimeout(syncWindow, 350); // settle pass (fonts, late layout)
}
$("#setupWrap").addEventListener("click", (e) => {
  if (e.target === $("#setupWrap")) closeSetup();
});

/** Close the setup wizard and return the OS window to the island's size. */
function closeSetup() {
  const wrap = $("#setupWrap");
  wrap.classList.remove("open");
  if (setupOpen) {
    setupOpen = false;
    syncWindow(true); // shrink back to the island now that the modal is gone
  }
}

/* ---------- island interactions ---------- */
function initInteractions() {
  const shell = $("#shell");
  const island = $("#island");

  island.addEventListener("click", (e) => {
    if (e.target.closest("button, input, select, textarea")) return;
    if (state.arranging) return; // arrange: the pill is for dragging, not toggling
    dismissFirstHint(true); // any real click means the user found it
    const was = state.expanded;
    state.expanded = !was;
    if (!state.expanded) state.settingsOpen = false;
    render();
  });

  // Open on hover, close on leave — the native Dynamic Island gesture, exactly
  // like the real app's onMouseEnter/onMouseLeave. Clicking still toggles, so
  // touch and keyboard users keep a path in.
  island.addEventListener("mouseenter", () => {
    dismissFirstHint(true); // hover IS the taught gesture — done, no need to nag
    if (!state.expanded && !state.arranging) {
      state.expanded = true;
      render();
    }
  });
  island.addEventListener("mouseleave", () => {
    if (state.expanded) collapsePanel();
  });

  island.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    dismissFirstHint(true);
    openCtx(e.clientX, e.clientY);
  });

  // Drag-to-reposition while arranging: pointerdown on the pill starts a drag
  // (Reset/Done buttons are excluded), pointermove steers the shell, pointerup
  // finishes. The position is committed only by Done (or a preset); Reset and
  // Escape restore the pre-arrange position.
  //
  // Dragging is throttled to ONE move_island_window IPC per animation frame:
  // pointermove fires far faster than the IPC + set_position round-trip can
  // complete, and flooding it queues dozens of window moves that the OS applies
  // serially — which is exactly the stutter/freeze. Coalescing the deltas and
  // flushing on rAF keeps the notch under the cursor in real-time without
  // spamming the host.
  let dragState = null;
  let pendingDrag = null;   // { x, y } latest clamped PHYSICAL target, flushed per frame
  let dragRaf = 0;
  // Window geometry captured at pointerdown: pointer events arrive in logical
  // CSS px, but the window is moved in PHYSICAL px (DPI-unambiguous, no
  // per-monitor scale juggling in the backend). Captured once — the window
  // doesn't move itself mid-drag. mon = ALL-monitor union bounds, physical +
  // scale (sf); mons = the per-monitor list for the top-edge magnet.
  let winOrigin = null; // { x, y } window top-left, physical, global
  let mon = null;       // { x, y, w, h, sf } union bounds, physical + scale
  let mons = null;      // [{ x, y, w, h }] each monitor's physical bounds
  const SNAP_ZONE = 40; // logical px — drop within this of a top edge magnetizes
  document.addEventListener("pointerdown", (e) => {
    if (!state.arranging) return;
    if (!e.target.closest(".island-shell")) return;
    if (e.target.closest(".arrange-btn")) return;
    // Grab offset from the ISLAND's top-left — under Tauri the drag moves the
    // window by exact deltas, so the offset must be measured against the thing
    // that visually moves (the island pill), not the (window-sized) shell.
    const r = $("#island").getBoundingClientRect();
    dragState = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height };
    // The island sits centered in a window that can be larger than it; recover
    // the window's physical origin from the live outer position.
    if (TAURI) {
      const w = TAURI.window.getCurrent();
      // Clamp bounds = union of ALL monitors (physical px), so the drag can
      // cross onto any display instead of being trapped on the origin one.
      Promise.all([
        w.outerPosition(),
        w.availableMonitors().catch(() => []),
        w.currentMonitor().catch(() => null),
      ]).then(([p, mons, cur]) => {
        winOrigin = { x: p.x, y: p.y };
        const sf = (cur && cur.scaleFactor) || window.devicePixelRatio || 1;
        let x0 = 0, y0 = 0, x1 = window.screen.width * sf, y1 = window.screen.height * sf;
        if (mons && mons.length) {
          x0 = Math.min(...mons.map((m) => m.position.x));
          y0 = Math.min(...mons.map((m) => m.position.y));
          x1 = Math.max(...mons.map((m) => m.position.x + m.size.width));
          y1 = Math.max(...mons.map((m) => m.position.y + m.size.height));
          dragState.mons = mons.map((m) => ({
            x: m.position.x, y: m.position.y,
            w: m.size.width, h: m.size.height,
          }));
        }
        mon = { x: x0, y: y0, w: x1 - x0, h: y1 - y0, sf };
      }).catch(() => {});
    }
    e.preventDefault();
  });
  document.addEventListener("pointermove", (e) => {
    if (!dragState || e.pointerId !== dragState.id) return;
    // Latest target in PHYSICAL px: origin + logical delta * scale. Clamped to
    // the drag-start monitor's bounds (with an 8px logical margin) so the
    // window can never be parked off-screen.
    const sf = (mon && mon.sf) || window.devicePixelRatio || 1;
    const o = winOrigin || { x: 0, y: 0 };
    let x = o.x + (e.clientX - dragState.dx) * sf;
    let y = o.y + (e.clientY - dragState.dy) * sf;
    if (mon) {
      const m8 = 8 * sf;
      x = Math.max(mon.x + m8, Math.min(x, mon.x + mon.w - dragState.w * sf - m8));
      y = Math.max(mon.y + m8, Math.min(y, mon.y + mon.h - dragState.h * sf - m8));
    }
    // Top-edge magnet (NotchDrop style): while dragging, if the notch's top
    // edge comes within SNAP_ZONE of a monitor's top edge (and the notch
    // horizontally overlaps that monitor), grab it flush to the edge.
    if (dragState.mons && dragState.mons.length) {
      const pillW = dragState.w * sf;
      for (const mo of dragState.mons) {
        if (x + pillW > mo.x && x < mo.x + mo.w) { // horizontal overlap
          const gap = (y - mo.y) / sf;              // logical px below the edge
          if (gap >= 0 && gap <= SNAP_ZONE) {
            y = mo.y;
            break;
          }
        }
      }
    }
    x = Math.round(x); y = Math.round(y);
    pendingDrag = { x, y };
    state.pos = { mode: "custom", x, y };
    if (!dragRaf) {
      dragRaf = requestAnimationFrame(function flush() {
        dragRaf = 0;
        if (!pendingDrag) return;
        // The outerPosition() fetch may not have resolved yet on a very fast
        // first move — wait a frame rather than send a target computed from a
        // (0,0) origin, which would teleport the window to the screen corner.
        if (TAURI && !winOrigin) {
          dragRaf = requestAnimationFrame(flush);
          return;
        }
        const { x, y } = pendingDrag;
        pendingDrag = null;
        if (TAURI) TAURI.core.invoke("move_island_window", { x, y }).catch(() => {});
      });
    }
  });
  document.addEventListener("pointerup", (e) => {
    if (dragState && e.pointerId === dragState.id) {
      dragState = null;
      // Flush the LAST pending move. pointerup (mouseup) follows the final
      // pointermove within the same event batch, before the scheduled rAF
      // fires — cancelling it here would drop the final position and leave the
      // OS window where it was a frame earlier, out of sync with the committed
      // state.pos. Send it now so the notch lands exactly under the cursor.
      if (dragRaf) {
        cancelAnimationFrame(dragRaf);
        dragRaf = 0;
      }
      if (pendingDrag && TAURI) {
        const { x, y } = pendingDrag;
        pendingDrag = null;
        TAURI.core.invoke("move_island_window", { x, y }).catch(() => {});
      } else {
        pendingDrag = null;
      }
    }
  });
  // A drag can be cancelled by the OS (orientation change, alt-tab, pen break)
  // without a pointerup. Clean up the same way so a stale rAF can't fire an
  // IPC after the drag is over, and a cancelled drag doesn't stick.
  document.addEventListener("pointercancel", (e) => {
    if (dragState && e.pointerId === dragState.id) {
      dragState = null;
      pendingDrag = null;
      if (dragRaf) {
        cancelAnimationFrame(dragRaf);
        dragRaf = 0;
      }
    }
  });

  // Note: use composedPath() (frozen at dispatch start), not e.target.closest() —
  // deck controls re-render the island mid-click, detaching the target, which
  // would otherwise make this "outside" check collapse the panel.
  document.addEventListener("click", (e) => {
    const inUi = e.composedPath().some((n) =>
      n.classList && (n.classList.contains("island-shell") || n.classList.contains("ctx-menu") || n.classList.contains("modal-wrap")));
    if (!e.composedPath().some((n) => n.classList && n.classList.contains("notch-select"))) closeNotchSelect();
    if (!inUi && !$("#ctx").hidden) $("#ctx").hidden = true;
    if (inUi) return;
    if (state.expanded && !state.settingsOpen) collapsePanel();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (nsOpenWrap) { closeNotchSelect(); return; }
    if ($("#setupWrap").classList.contains("open")) { closeSetup(); return; }
    // Escape cancels an arrange session and restores the pre-arrange position.
    if (state.arranging) {
      if (state.arrangeOrigin) {
        state.pos = { ...state.arrangeOrigin };
        // Re-apply the restored position to the REAL window.
        if (state.pos.mode === "custom") {
          TAURI.core.invoke("move_island_window", { x: state.pos.x, y: state.pos.y }).catch(() => {});
        } else if (state.pos.mode !== "default") {
          TAURI.core.invoke("move_island_window", { anchor: state.pos.mode }).catch(() => {});
        } else {
          syncWindow(true);
        }
      }
      state.arranging = false;
      render();
      return;
    }
    if (!state.expanded) return;
    collapsePanel();
  });
}

/* ---------- Tauri window integration ----------
   This page runs inside a transparent, always-on-top Tauri window (the real
   notch). The OS window is grown to match the island's rendered size and
   anchored top-center on the display, so the notch hugs the screen edge
   exactly and the deck never clips. */
// The page ships inside the Tauri webview; TAURI is the global API bridge.
const TAURI = window.__TAURI__ || null;
const IS_TAURI = !!(TAURI && TAURI.core && TAURI.core.invoke);
// Standalone settings window: the page doubles as a full-page settings app
// when loaded with ?view=settings (the notch never grows to fit the deck —
// settings live in their own window, opened via open_settings).
const SETTINGS_VIEW = /[?&]view=settings/.test(location.search) || location.hash === "#settings";
let resizeSettleTimer = null;
let pendingCollapse = false;
let lastExpanded = false;
let lastSize = null;

function syncWindow(force = false) {
  if (!TAURI) return;
  if (SETTINGS_VIEW) return; // the settings window is user-sized, not fitted
  const island = $("#island");
  if (!island) return;
  // While the setup wizard is open the window must fit the MODAL (the island
  // stays collapsed underneath it). Rendered size in CSS px, +16 margin.
  if (setupOpen) {
    const modalEl = $("#setupModal");
    if (modalEl && modalEl.offsetHeight > 0) {
      const mw = Math.ceil(modalEl.offsetWidth) + 16;
      // Height includes the modal's offset from the window top (the wrap's
      // padding-top) — otherwise the modal's bottom lands below the window
      // edge and the "Get started" button gets clipped.
      const mh = Math.ceil(modalEl.offsetTop + modalEl.offsetHeight) + 16;
      // Sanity floor: a modal this small means the measurement collapsed
      // (stale cap, mid-relayout) — never shrink the wizard window to a
      // sliver, keep the last good fit instead.
      if (mw >= 200 && mh >= 120) {
        TAURI.core.invoke("fit_island_to_content", { width: mw, height: mh, recenter: state.pos.mode === "default" }).catch(() => {});
      }
    }
    lastExpanded = state.expanded;
    return;
  }
  const w = parseFloat(island.style.width) || 330;
  // A status toast hangs below the pill — grow the window to fit it while
  // visible, then shrink back on dismiss (syncWindow re-measures each time).
  const toastEl = $("#statusToast");
  const toastH = toastEl && !toastEl.classList.contains("out") ? toastEl.offsetHeight + 8 : 0;
  const h = (parseFloat(island.style.height) || 36) + toastH;
  // Only snap back to the screen edge when a position preset = default is
  // active. If the user dragged the notch somewhere (custom/left/right), keep
  // the window attached to its live center so the deck grows in place.
  const recenter = state.pos.mode === "default";
  const send = () => {
    // `force` re-sends even when the size is unchanged (position presets use
    // it to re-center the window); normally identical sizes are skipped.
    if (!force && lastSize && lastSize[0] === w && lastSize[1] === h) return;
    lastSize = [w, h];
    TAURI.core.invoke("fit_island_to_content", { width: w, height: h, recenter }).catch(() => {});
  };
  const justCollapsed = lastExpanded === true && state.expanded === false;
  clearTimeout(resizeSettleTimer);
  if (state.expanded) {
    // Expanding needs the room immediately so the panel never clips.
    pendingCollapse = false;
    send();
  } else if (justCollapsed || pendingCollapse) {
    // Mid-collapse: let the island's close spring (0.42s) finish before the
    // window shrinks, otherwise the closing panel gets clipped. Boot / stable
    // collapsed states have no animation, so they shrink immediately below.
    pendingCollapse = true;
    resizeSettleTimer = setTimeout(() => {
      pendingCollapse = false;
      send();
    }, 700);
  } else {
    // Boot or stable collapsed — no spring running, fit the window at once.
    send();
  }
  lastExpanded = state.expanded;
}

/* ---- live backend data (real stats / media / calls / mic) ----
   Everything on the island reflects actual OS state via backend commands
   and push events. */
let liveMedia = null;
let lastMediaKey = null;

function applySystemStats(s) {
  if (!s) return;
  stats.cpu = s.cpu;
  // temp/battery may be absent (no sensor / desktop without a battery) — null
  // them so systemRows hides the row instead of showing a stale or 0 value.
  stats.temp = (typeof s.tempC === "number" && s.tempC != null) ? s.tempC : null;
  if (s.memTotalGb > 0) stats.mem = (s.memUsedGb / s.memTotalGb) * 100;
  stats.bat = s.battery ? s.battery.pct : null;
  // Network throughput is null on the very first poll while the baseline is
  // captured; the NET row hides until a real reading exists.
  stats.netDown = s.network ? (s.network.downBytesPerSec / 1024) : null; // kB/s
  stats.netUp = s.network ? (s.network.upBytesPerSec / 1024) : null;
  refreshWidgets();
}

/* Resolve the current media track from the live SMTC session.
   Returns { title, artist, dur, pos, playing }; nothing playing → empty state. */
function mediaTrack() {
  if (liveMedia && (liveMedia.title || liveMedia.artist)) {
    return {
      title: liveMedia.title || "Unknown track",
      artist: liveMedia.artist || "",
      dur: liveMedia.duration || 0,
      pos: liveMedia.position || 0,
      playing: !!liveMedia.playing,
    };
  }
  return { title: "Nothing playing", artist: "", dur: 0, pos: 0, playing: false };
}

function mediaCommand(cmd) {
  if (TAURI) TAURI.core.invoke(cmd).catch(() => {});
}

function setLiveMedia(m) {
  liveMedia = m || null;
  const prevPlaying = state.dial.playing;
  const playing = !!(liveMedia && liveMedia.playing);
  state.dial.playing = playing;
  const key = liveMedia ? ((liveMedia.title || "") + "|" + (liveMedia.artist || "")) : "";
  // Re-render the island only when the strip-visible state changes (track
  // identity or play/pause); position ticks just refresh the cards.
  if (playing !== prevPlaying || key !== lastMediaKey) {
    const trackChanged = key !== lastMediaKey;
    lastMediaKey = key;
    render();
    // Media-change toast (reference parity): only on a NEW playing track,
    // never on position ticks or on pause.
    if (trackChanged && playing && liveMedia && liveMedia.title) {
      statusToast({ icon: "🎵", title: String(liveMedia.title).slice(0, 40), body: liveMedia.artist || "Now playing" });
    }
  } else {
    refreshWidgets();
  }
}

function setLiveCall(c) {
  const onCall = !!(c && c.onCall);
  if (onCall === state.dial.call) return;
  state.dial.call = onCall;
  state.callStart = onCall ? Date.now() : 0;
  render();
}

function setLiveMic(m) {
  const on = !!(m && m.on);
  if (on === state.dial.mic) return;
  state.dial.mic = on;
  render();
}

function wireLiveData() {
  if (!TAURI) return;
  setInterval(() => {
    TAURI.core.invoke("system_stats").then(applySystemStats).catch(() => {});
  }, 2000);
  TAURI.core.invoke("media_get_state").then(setLiveMedia).catch(() => {});
  // Smooth progress: the backend emits position only when it changes by
  // >0.4s (~2x/second). Interpolate between emissions so the progress bar
  // and clock advance every second instead of stepping.
  setInterval(() => {
    if (liveMedia && liveMedia.playing && liveMedia.duration > 0) {
      liveMedia.position = Math.min(liveMedia.position + 0.5, liveMedia.duration);
      refreshWidgets();
    }
  }, 500);
  TAURI.core.invoke("call_get_state").then(setLiveCall).catch(() => {});
  TAURI.core.invoke("mic_get_state").then(setLiveMic).catch(() => {});
  TAURI.event.listen("media://state", (e) => setLiveMedia(e.payload)).catch(() => {});
  TAURI.event.listen("call://state", (e) => setLiveCall(e.payload)).catch(() => {});
  TAURI.event.listen("mic://state", (e) => setLiveMic(e.payload)).catch(() => {});
  // Priority status alerts (battery/charger/Wi-Fi/mic-cam) and the in-memory
  // clipboard history — both pushed from the backend.
  TAURI.event.listen("winotch://status", (e) => statusToast(e.payload)).catch(() => {});
  TAURI.event.listen("winotch://clipboard", (e) => setClipboardList(e.payload)).catch(() => {});
  TAURI.core.invoke("get_clipboard_history")
    .then((l) => { state.clipboardItems = l || []; if (state.widgets.clipboard) render(); })
    .catch(() => {});
  // Live Windows theme/accent — also pulls once immediately (get_system_theme
  // re-emits, so the single listener catches both).
  TAURI.event.listen("winotch://theme", (e) => setWinTheme(e.payload)).catch(() => {});
  TAURI.core.invoke("get_system_theme").then(setWinTheme).catch(() => {});
  // Boot position: the BACKEND is the source of truth — it re-applies the
  // persisted spot in setup(), before this page even loads. Sync state.pos with
  // it so presets/hover recentering agree, and persist it back to localStorage
  // so both stores can never diverge.
  TAURI.core.invoke("get_saved_position")
    .then((sp) => {
      if (sp && sp.mode) {
        state.pos = { mode: sp.mode, x: sp.x, y: sp.y };
        persist();
        if (sp.mode === "custom") {
          // Backend already placed us exactly; just confirm the committed spot.
          TAURI.core.invoke("move_island_window", { x: sp.x, y: sp.y }).catch(() => {});
        } else if (sp.mode !== "default") {
          TAURI.core.invoke("move_island_window", { anchor: sp.mode }).catch(() => {});
        } else {
          syncWindow(true); // re-center top on the saved monitor
        }
      }
    })
    .catch(() => {});
}

let lastEffect = null;
function syncNativeEffect() {
  if (!TAURI) return;
  const e = state.frosted ? "frosted" : state.glass ? "glass" : "solid";
  if (e === lastEffect) return;
  lastEffect = e;
  TAURI.core.invoke("set_island_effect", { effect: e }).catch(() => {});
}

/* ---- live Windows theme + accent ----
   Theme "System" reads the actual Windows app theme; "Color" can follow the
   real Windows accent. The backend emits winotch://theme on every OS change
   (Settings → Personalization), and the watcher also re-emits on demand via
   get_system_theme — so the island reskins live, no restart. */
let winTheme = null; // { theme: "light"|"dark", accent: [r,g,b] }
function setWinTheme(t) {
  if (!t) return;
  const changed = !winTheme || winTheme.theme !== t.theme ||
    String(winTheme.accent) !== String(t.accent);
  winTheme = t;
  if (changed) {
    applyTheme();
    if (state.expanded) render();
  }
}
// effectiveTheme/effectiveAccent consult winTheme when set.
const _matchMediaTheme = () => {
  try {
    return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  } catch { return "dark"; }
};

if (TAURI) {
  // "Rerun Setup…" from the system tray reopens the designv2 wizard.
  TAURI.event.listen("winotch://rerun-setup", () => openSetup("rerun")).catch(() => {});
  // "Arrange…" from the settings window hands the drag session back to the
  // notch window (which is where the pill actually lives).
  if (!SETTINGS_VIEW) {
    TAURI.event.listen("winotch://arrange", () => {
      state.arrangeOrigin = { ...state.pos };
      state.expanded = false;
      state.settingsOpen = false;
      state.arranging = true;
      render();
    }).catch(() => {});
  }
  // The NOTCH window is transparent over the real desktop (native DWM blur is
  // applied via set_island_effect when a glass surface is active). The black
  // box that flashes during expand/collapse comes from the <html> root: the
  // OS window (and the island's CSS transition) resizes ahead of the webview
  // repaint, and WebView2 composites the newly-exposed region using the root
  // element's background. Making BOTH roots transparent lets the desktop show
  // through the gap instead of a solid box. (The settings window is a normal
  // opaque window — it keeps its own background.)
  if (!SETTINGS_VIEW) {
    document.documentElement.style.background = "transparent";
    document.body.style.background = "transparent";
    // Tag the root so app-only CSS can apply (see the .tauri island overrides):
    // the island's outer drop shadow extends ~28px past the pill, but the OS
    // window hugs the island exactly — Windows clips that shadow at the
    // rectangular window bounds, rendering the "black box" fringe around the
    // rounded notch. In the app the shadow must go (inset highlights stay);
    // the standalone browser demo keeps it since nothing clips there.
    document.documentElement.classList.add("tauri");
    wireLiveData();
    // First-run weather auto-detect: silently resolve the user's location from
    // the OS when none has ever been set (see maybeAutoDetectLocation).
    setTimeout(maybeAutoDetectLocation, 2500);
  }
}

/* ---------- boot ---------- */
draft = snapshot();
applyTheme();
if (SETTINGS_VIEW) {
  // Standalone settings window: a header + the full deck, nothing else. No
  // island, no window-fitting, no live-data wiring — the notch window runs
  // that side of the app.
  document.body.classList.add("settings-view");
  const root = h("div", "settings-root");
  root.id = "settingsRoot";
  document.body.appendChild(root);
  render();
} else {
  initInteractions();
  render();
  // Brand-new install: greet the user with the setup wizard (the factory-reset
  // path opens it explicitly; this covers the very first launch only).
  if (!state.onboarded) {
    openSetup("fresh");
    state.onboarded = true;
    store.save("onboarded", true);
  }
}
</script>
</body>
</html>
