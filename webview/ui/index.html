<body>
  <div class="island-shell" id="shell">
    <div class="island" id="island"></div>
  </div>

  <div class="ctx-menu" id="ctx" hidden></div>

  <div class="modal-wrap" id="setupWrap">
    <div class="modal" id="setupModal"></div>
  </div>

<script>
"use strict";

/* ---------- tiny helpers ---------- */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

const store = {
  load(key, dflt) {
    try {
      const v = localStorage.getItem("winotch." + key);
      return v == null ? dflt : JSON.parse(v);
    } catch { return dflt; }
  },
  save(key, val) {
    try { localStorage.setItem("winotch." + key, JSON.stringify(val)); } catch {}
  },
};

/* ---------- widget inventory ---------- */
const WIDGET_TYPES = ["clock", "system", "media", "notes", "weather", "launcher", "focus", "clipboard"];
const WIDGET_LABELS = { clock: "Clock", system: "System stats", media: "Now playing", notes: "Notes", weather: "Weather", launcher: "App launcher", focus: "Focus timer", clipboard: "Clipboard" };
const NS_OPTIONS = [["brand", "Brand + clock"], ["clock", "Clock only"], ["custom", "Custom text"], ["system", "System stats"], ["blank", "Nothing (dot only)"]];
const DEFAULT_ORDER = ["clock", "system", "media", "notes", "weather", "launcher", "focus", "clipboard"];
const DEFAULT_WIDGETS = { clock: true, system: true, media: true, notes: true, weather: true, launcher: true, focus: false, clipboard: false };

const QUICK_APPS = [
  { label: "Chrome", path: "chrome.exe" },
  { label: "Edge", path: "msedge.exe" },
  { label: "Terminal", path: "wt.exe" },
  { label: "VS Code", path: "code.exe" },
  { label: "Notepad", path: "notepad.exe" },
  { label: "Calculator", path: "calc.exe" },
  { label: "Paint", path: "mspaint.exe" },
  { label: "Spotify", path: "%APPDATA%\\Spotify\\Spotify.exe" },
  { label: "Steam", path: "C:\\Program Files (x86)\\Steam\\steam.exe" },
];

/* WMO codes → emoji + label, mirroring the real app. */
function mapWeather(code) {
  if (code === 0) return { emoji: "☀️", label: "Clear" };
  if (code === 1) return { emoji: "🌤️", label: "Mostly clear" };
  if (code === 2) return { emoji: "⛅", label: "Partly cloudy" };
  if (code === 3) return { emoji: "☁️", label: "Overcast" };
  if (code === 45 || code === 48) return { emoji: "🌫️", label: "Fog" };
  if (code >= 51 && code <= 57) return { emoji: "🌦️", label: "Drizzle" };
  if (code >= 61 && code <= 67) return { emoji: "🌧️", label: "Rain" };
  if (code >= 71 && code <= 77) return { emoji: "❄️", label: "Snow" };
  if (code >= 80 && code <= 82) return { emoji: "🌦️", label: "Showers" };
  if (code === 85 || code === 86) return { emoji: "🌨️", label: "Snow showers" };
  if (code >= 95) return { emoji: "⛈️", label: "Thunderstorm" };
  return { emoji: "🌡️", label: "Unknown" };
}

/* upgrade older persisted widget sets to the current one (merge defaults in
   so new widget types appear without clobbering existing toggles) */
function migrateWidgets() {
  const old = store.load("widgets", null);
  if (old && typeof old === "object" && ["weather", "launcher", "focus", "clipboard"].some((k) => !(k in old))) {
    const merged = { ...DEFAULT_WIDGETS };
    for (const k of Object.keys(old)) if (k in merged) merged[k] = !!old[k];
    return merged;
  }
  return store.load("widgets", { ...DEFAULT_WIDGETS });
}

/* ---------- state ---------- */
const state = {
  shape: store.load("shape", "notch"),
  theme: store.load("theme", "dark"),          // light | dark | system | color
  accent: store.load("accent", "#4fc3ff"),     // "system" | "#rrggbb"
  glass: store.load("glass", true),
  frosted: store.load("frosted", false),
  opacity: store.load("glassOpacity", 65),
  blur: store.load("glassBlur", 14),
  gradient: store.load("gradient", "none"),    // none | sunset | ocean | aurora | candy | graphite
  size: store.load("size", { width: 330, height: 36 }),
  idleContent: store.load("idleContent", "brand"), // brand | clock | custom | system | blank
  idleText: store.load("idleText", ""),
  pos: store.load("pos", { mode: "default", x: 0, y: 0 }), // default | left | right | custom
  widgets: migrateWidgets(),
  widgetOrder: store.load("widgetOrder", DEFAULT_ORDER),
  sysMetrics: store.load("sysMetrics", { cpu: true, temp: true, mem: true, bat: true, net: true }),
  notes: store.load("notes", ""),
  weather: store.load("weather", { city: "", lat: null, lon: null }),
  launcherApps: store.load("launcherApps", QUICK_APPS),
  // focus timer (ported from the reference Winotch) — persists across restarts
  focusTimer: store.load("focusTimer", { status: "stopped", phase: "focus", preset: "25", focusMin: 25, breakMin: 5, autoCycle: false, startedAt: 0, pausedElapsed: 0, pausedAt: null, cycles: 0 }),
  // clipboard history — in-memory only, filled from the backend listener
  clipboardItems: [],
  // runtime
  expanded: false,
  settingsOpen: false,
  arranging: false,     // arrange session: collapsed pill shows Reset/Done while dragging
  arrangeOrigin: null,  // position captured when arrange started (for Escape/Reset)
  hidden: false,
  editing: null,      // widget type whose card is in edit mode
  addOpen: false,     // "+" add-widget menu open?
  dial: { call: false, mic: false, playing: false },
  onboarded: store.load("onboarded", false), // first-run: auto-open the setup wizard once
  // The deck opens as one full settings sheet (like the real app's settings),
  // with every section visible and each header showing its current value.
  openSections: { general: true, shape: true, size: true, appearance: true, theme: true, idle: true, widgets: true },
  dirty: false,
  applied: false,
  callStart: 0,
};

/* draft copy for staged Apply */
let draft = null;
function snapshot() {
  return {
    shape: state.shape, theme: state.theme, accent: state.accent, glass: state.glass, frosted: state.frosted,
    opacity: state.opacity, blur: state.blur, gradient: state.gradient,
    size: { ...state.size }, idleContent: state.idleContent, idleText: state.idleText,
    widgets: { ...state.widgets }, widgetOrder: [...state.widgetOrder],
    sysMetrics: { ...state.sysMetrics },
  };
}
function isDirty() {
  const d = draft, s = state;
  return !(d.shape === s.shape && d.theme === s.theme && d.accent === s.accent &&
    d.glass === s.glass && d.frosted === s.frosted && d.opacity === s.opacity && d.blur === s.blur &&
    d.gradient === s.gradient && d.idleContent === s.idleContent && d.idleText === s.idleText &&
    d.size.width === s.size.width && d.size.height === s.size.height &&
    JSON.stringify(d.widgets) === JSON.stringify(s.widgets) &&
    JSON.stringify(d.sysMetrics) === JSON.stringify(s.sysMetrics));
}
function persist() {
  store.save("shape", state.shape); store.save("theme", state.theme); store.save("accent", state.accent);
  store.save("glass", state.glass); store.save("frosted", state.frosted); store.save("glassOpacity", state.opacity); store.save("glassBlur", state.blur);
  store.save("gradient", state.gradient); store.save("size", state.size); store.save("idleContent", state.idleContent);
  store.save("idleText", state.idleText); store.save("pos", state.pos);
  store.save("widgets", state.widgets); store.save("widgetOrder", state.widgetOrder);
  store.save("sysMetrics", state.sysMetrics); store.save("notes", state.notes);
  store.save("weather", state.weather); store.save("launcherApps", state.launcherApps);
  store.save("focusTimer", state.focusTimer);
}

/* ---------- system stats (live from the backend) ----------
   Filled by wireLiveData()'s system_stats poll before first paint of the
   widgets; rows whose value is still null simply hide until data arrives. */
const stats = { cpu: null, temp: null, mem: null, bat: null, netUp: null, netDown: null };
const fmtTime = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

/* ---------- clock ---------- */
let now = new Date();
setInterval(() => { now = new Date(); tickClock(); focusTick(); }, 1000);
const timeParts = () => {
  const t = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const i = t.indexOf(":");
  return i === -1 ? { lead: t, tail: "" } : { lead: t.slice(0, i), tail: t.slice(i + 1) };
};
function tickClock() {
  const t = timeParts();
  $$("#island .lead").forEach((e) => (e.textContent = t.lead));
  $$("#island .tail").forEach((e) => (e.textContent = t.tail));
  const el = $("#callTimer");
  if (el && state.dial.call) el.textContent = fmtTime(Math.floor((Date.now() - state.callStart) / 1000));
}

/* ---------- theme ---------- */
const ACCENT_SWATCHES = ["#4fc3ff", "#7cd4ff", "#3ddc97", "#ffc14d", "#ff6b6b", "#b18cff", "#e9b949"];
function effectiveTheme() {
  if (state.theme === "light") return "light";
  if (state.theme === "dark") return "dark";
  // system: the REAL Windows theme reported by the backend (live-updated).
  if (winTheme) return winTheme.theme === "light" ? "light" : "dark";
  return _matchMediaTheme(); // pre-boot fallback until the first theme event
}
function effectiveAccent() {
  if (state.accent === "system") {
    // Follow the real Windows accent color when the backend reports it.
    if (winTheme && Array.isArray(winTheme.accent) && winTheme.accent.length === 3) {
      const [r, g, b] = winTheme.accent;
      return "#" + [r, g, b].map((c) => c.toString(16).padStart(2, "0")).join("");
    }
    return effectiveTheme() === "light" ? "#0078d4" : "#4fc3ff";
  }
  return state.accent;
}
function applyTheme() {
  const t = effectiveTheme();
  document.documentElement.dataset.theme = t;
  const a = effectiveAccent();
  document.documentElement.style.setProperty("--accent", a);
  document.documentElement.style.setProperty("--led-strong", t === "light" ? "#0067b8" : "#7cd4ff");
  document.documentElement.style.setProperty("--accent-soft", hexToRgba(a, t === "light" ? 0.12 : 0.14));
  document.documentElement.style.setProperty("--accent-strong", hexToRgba(a, 0.32));
  document.documentElement.style.setProperty("--glass-opacity", String(state.opacity / 100));
  document.documentElement.style.setProperty("--glass-blur", state.blur + "px");
}
function hexToRgba(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return "rgba(79, 195, 255, " + a + ")";
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

/* ================================================================
   RENDER
   ================================================================ */
// raised by render() when the settings deck is being mounted fresh (absent
// before this draw) so buildDeck can stagger the cards in. Every later
// re-render — staging a chip, moving a slider — rebuilds the deck but leaves
// this false, so the cascade never replays on interactions.
let deckFreshMount = false;

function render() {
  applyTheme();
  // Standalone settings window: no island — the deck fills the window. Every
  // deck action (chips, sections, Apply, Reset) lands here; slider/color
  // drags never call render() (they patch the DOM directly), so nothing is
  // destroyed mid-drag. Scroll + focus are preserved across rebuilds.
  if (SETTINGS_VIEW) {
    const root = $("#settingsRoot");
    if (!root) return;
    const sc = root.querySelector(".deck-scroll");
    const st = sc ? sc.scrollTop : 0;
    const act = document.activeElement;
    const focusId = act && act.id && root.contains(act) ? act.id : null;
    deckFreshMount = !$("#deck");
    root.innerHTML = "";
    root.appendChild(settingsHead());
    root.appendChild(buildDeck());
    const sc2 = root.querySelector(".deck-scroll");
    if (sc2) sc2.scrollTop = st;
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) el.focus({ preventScroll: true });
    }
    return;
  }
  const island = $("#island");
  const expanded = state.expanded;
  const arranging = state.arranging;
  deckFreshMount = state.settingsOpen && !$("#deck");

  // ---- preserve panel scroll + focus across the full rebuild ----
  // render() wipes and recreates the .panel-body scroller, which would reset
  // the scroll position to the top on EVERY interaction (clicking a chip down
  // in the deck would teleport you back to the top). Capture the offsets and
  // the focused control first so they can be restored after the draw below.
  const prevView = state.settingsOpen ? "settings" : "widgets";
  const prevScroll = (() => {
    const sc = island.querySelector(".panel-body");
    return sc ? { top: sc.scrollTop, left: sc.scrollLeft } : null;
  })();
  const focusKey = (() => {
    const act = document.activeElement;
    if (!act || act === document.body || !island.contains(act)) return null;
    if (act.id) return "id:" + act.id;
    const keys = Object.keys(act.dataset);
    if (keys.length) return "data:" + keys[0] + "=" + (act.dataset[keys[0]] ?? "");
    return null;
  })();
  island.className = "island shape-" + state.shape +
    (arranging ? " mode-collapsed" : (expanded ? " mode-expanded" : " mode-collapsed")) +
    (state.glass ? " glass" : "") + (state.frosted ? " frosted" : "");

  island.innerHTML = "";
  if (state.gradient !== "none") {
    island.appendChild(h("div", "island-grad grad-" + state.gradient, ""));
  }

  /* ---- strip ---- */
  const strip = h("header", "island-strip");
  const dot = h("span", "led");
  dot.dataset.mic = state.dial.mic ? "on" : "off";
  dot.dataset.call = state.dial.call ? "on" : "off";
  if (state.dial.playing && !state.dial.call) dot.classList.add("playing");
  strip.appendChild(dot);

  const body = h("div", "island-strip-body");
  // flex:0 1 auto keeps the content clustered so the strip's centered
  // justify-content centers the whole LED + content group, not just the text.
  body.style.cssText = "display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;";
  strip.appendChild(body);

  if (state.arranging) {
    // Arrange session: the pill shows Reset/Done instead of the idle content
    // so the user knows exactly how to finish (or undo) the reposition.
    const ar = h("div", "arrange");
    ar.innerHTML = `<span class="arrange-hint">drag to reposition</span>
      <button type="button" class="arrange-btn arrange-reset" id="arReset">Reset</button>
      <button type="button" class="arrange-btn arrange-done" id="arDone">Done</button>`;
    ar.querySelector("#arReset").onclick = (e) => {
      e.stopPropagation();
      state.pos = { mode: "default", x: 0, y: 0 };
      state.arranging = false;
      persist();
      syncWindow(true); // re-center the real window on top
      render();
    };
    ar.querySelector("#arDone").onclick = (e) => {
      e.stopPropagation();
      state.arranging = false;
      // Done finalizes the drag: dropped near a monitor's top edge → the
      // backend magnetizes the notch flush to it (mode "default", top-center
      // of that monitor); dropped lower → it floats where released (mode
      // "custom"). The returned position + mode are persisted so restarts
      // restore it there.
      if (TAURI) {
        TAURI.core.invoke("dock_island_to_monitor")
          .then((p) => {
            if (p && typeof p.x === "number" && typeof p.y === "number") {
              state.pos = { mode: p.mode || "custom", x: p.x, y: p.y };
              persist();
            }
          })
          .catch(() => {});
      }
      persist();
      render();
    };
    body.appendChild(ar);
  } else if (state.dial.call) {
    const cp = h("div", "call-pill");
    const now = Math.floor((Date.now() - state.callStart) / 1000);
    cp.innerHTML = `<span class="tag">● call</span><span id="callTimer">${fmtTime(now)}</span><span class="value" style="opacity:.6">— ${esc(state.dial.mic ? "mic live" : "muted")}</span>`;
    body.appendChild(cp);
  } else if (state.dial.playing) {
    const mnp = h("div", "mini-nowplaying");
    const t = mediaTrack();
    mnp.innerHTML = `<span class="ga">♪</span><span class="track">${esc(t.title)}${t.artist ? " — " + esc(t.artist) : ""}</span>`;
    body.appendChild(mnp);
  } else if (state.idleContent === "system") {
    const sm = h("div", "sysm");
    sm.innerHTML =
      (state.sysMetrics.cpu ? `<span class="sysm-chip" data-k="cpu">CPU <b>${Math.round(stats.cpu)}%</b></span>` : "") +
      (state.sysMetrics.mem ? `<span class="sysm-chip" data-k="mem">MEM <b>${Math.round(stats.mem)}%</b></span>` : "") +
      (state.sysMetrics.bat && stats.bat != null ? `<span class="sysm-chip" data-k="bat">BAT <b>${Math.round(stats.bat)}%</b></span>` : "");
    body.appendChild(sm);
  } else if (state.idleContent === "brand") {
    body.appendChild(h("span", "brand", "Winotch"));
    body.appendChild(h("span", "divider", ""));
    const c = h("span", "clock");
    const t = timeParts();
    c.innerHTML = `<span class="clock-time"><span class="lead">${esc(t.lead)}</span><span class="colon" aria-hidden>:</span><span class="tail">${esc(t.tail)}</span></span>`;
    body.appendChild(c);
  } else if (state.idleContent === "clock") {
    const c = h("span", "clock");
    const t = timeParts();
    c.innerHTML = `<span class="clock-time"><span class="lead">${esc(t.lead)}</span><span class="colon" aria-hidden>:</span><span class="tail">${esc(t.tail)}</span></span>`;
    body.appendChild(c);
  } else if (state.idleContent === "custom") {
    const txt = state.idleText.trim();
    if (txt) body.appendChild(h("span", "island-custom-text", esc(txt)));
    else body.appendChild(h("span", "island-custom-text is-muted", "No text set — open settings"));
  }
  // First-run guidance rides INSIDE the pill (the OS window hugs the island,
  // so a tooltip drawn outside would be clipped). While active it REPLACES the
  // idle content — the pill shows one focused message instead of a text wall —
  // and applyIslandSize widens the pill to fit it. It dismisses on the first
  // real interaction or after 12s, reverting to the brand/clock.
  if (firstHintActive && !expanded && !arranging) {
    body.innerHTML = "";
    const hh = h("span", "first-hint", "");
    hh.innerHTML = `<b>hover</b> or <b>click</b> · right-click for options`;
    body.appendChild(hh);
  }
  // One-shot launch sweep: a shine crosses the collapsed pill once per launch
  // (boot, or right after the setup wizard closes). The flag is consumed on the
  // NEXT tick, not inline: the wizard-close path re-renders synchronously
  // right after (maybeFirstHint), and consuming inline would let that second
  // render wipe the sweep before it ever plays. Re-mounting it there is fine —
  // the 0.45s animation delay absorbs the double-mount. Any LATER render
  // (hover/expand) can't resurrect it.
  if (bootSweep && !expanded && !arranging) {
    strip.appendChild(h("span", "sweep", ""));
    setTimeout(() => { bootSweep = false; }, 0);
  }
  // blank: just the LED
  island.appendChild(strip);

  /* ---- panel ---- */
  if (expanded) {
    const panel = h("section", "island-panel");
    const head = h("div", "panel-head");
    // On a fresh mount (deckFreshMount, set at the top of render) let the
    // header lead the gravity cascade; re-renders skip it so staging and
    // slider drags stay calm.
    if (deckFreshMount) head.classList.add("head-reveal");
    head.innerHTML = `<span class="led"></span><span class="panel-title">${state.settingsOpen ? "Settings" : "Widgets"}</span><span class="spacer"></span>`;

    if (!state.settingsOpen) {
      const addWrap = h("div", "add-wrap");
      const add = h("button", "icon-btn" + (state.addOpen ? " active" : ""), "+");
      add.title = "Add widget";
      add.onclick = (e) => { e.stopPropagation(); state.addOpen = !state.addOpen; render(); };
      addWrap.appendChild(add);
      if (state.addOpen) {
        const menu = h("div", "add-menu");
        const avail = WIDGET_TYPES.filter((t) => !state.widgets[t]);
        if (avail.length === 0) menu.appendChild(h("div", "empty", "All widgets added"));
        else avail.forEach((t) => {
          const b = h("button", "", WIDGET_LABELS[t]);
          b.onclick = (e) => { e.stopPropagation(); addWidget(t); };
          menu.appendChild(b);
        });
        addWrap.appendChild(menu);
      }
      head.appendChild(addWrap);
    }

    const gear = h("button", "icon-btn", "⚙");
    gear.title = "Settings";
    gear.onclick = (e) => {
      e.stopPropagation();
      // Settings live in their own window — the notch pill never grows to fit
      // the deck. (Browser/preview has no second window, so it flips to the
      // ?view=settings page instead.)
      if (TAURI) {
        TAURI.core.invoke("open_settings").catch(() => {});
      } else {
        location.search = "?view=settings";
      }
    };
    const close = h("button", "icon-btn", "✕");
    close.title = "Collapse";
    close.onclick = (e) => { e.stopPropagation(); collapsePanel(); };
    head.appendChild(gear);
    head.appendChild(close);
    panel.appendChild(head);

    const pb = h("div", "panel-body");
    if (state.settingsOpen) pb.appendChild(buildDeck());
    else pb.appendChild(buildWidgets());
    panel.appendChild(pb);
    island.appendChild(panel);
  }

  /* drag affordance (arrange mode only) */
  island.style.cursor = arranging ? "grab" : "default";
  island.style.touchAction = arranging ? "none" : "";
  if (arranging) {
    island.dataset.drag = "on";
    island.title = "Drag to reposition — Done to keep, Reset for default";
  } else {
    delete island.dataset.drag;
    island.title = "";
  }

  // ---- restore focus, then pin the scroll LAST ----
  // Switching settings <-> widgets is deliberate navigation and starts at the
  // top; editing a control in-place keeps exactly where the user was. The deck
  // is rebuilt on every interaction, and both focus() and applyIslandSize()
  // can nudge the scroller (focus's scroll-into-view ignores preventScroll
  // here), so the position is re-asserted after everything else, and again on
  // the next frame in case the layout settles late.
  const nextView = state.settingsOpen ? "settings" : "widgets";
  if (focusKey) {
    let el = null;
    if (focusKey.startsWith("id:")) {
      el = island.querySelector("#" + CSS.escape(focusKey.slice(3)));
    } else if (focusKey.startsWith("data:")) {
      const sep = focusKey.indexOf("=", 5);
      el = island.querySelector(`[data-${focusKey.slice(5, sep)}="${focusKey.slice(sep + 1)}"]`);
    }
    if (el && typeof el.focus === "function") el.focus({ preventScroll: true });
  }

  applyIslandSize();
  applyPosition();
  syncWindow();
  syncNativeEffect();

  if (prevView === nextView && prevScroll) {
    const pin = () => {
      const sc = island.querySelector(".panel-body");
      if (sc) {
        sc.scrollTop = prevScroll.top;
        sc.scrollLeft = prevScroll.left;
      }
    };
    pin();
    requestAnimationFrame(pin);
  }
}

/* ---- standalone settings window (view=settings) ---- */
function settingsHead() {
  const head = h("header", "settings-head");
  head.innerHTML = `<span class="led"></span>
    <span class="settings-head-title">Winotch <strong>Settings</strong></span>
    <span class="spacer"></span>`;
  const close = h("button", "icon-btn", "✕");
  close.title = "Close settings";
  close.onclick = (e) => { e.stopPropagation(); closeSettingsWindow(); };
  head.appendChild(close);
  return head;
}

function closeSettingsWindow() {
  if (TAURI) {
    TAURI.window.getCurrent().close().catch(() => {});
  } else {
    // Browser/preview: the settings view is a query-param flip — reload back
    // into the notch view.
    history.replaceState(null, "", location.pathname);
    location.reload();
  }
}

/* ---------- island geometry (top-center, size to content) ---------- */
function applyIslandSize() {
  if (SETTINGS_VIEW) return; // no island in the standalone settings window
  const island = $("#island");
  const expanded = state.expanded;
  // Cap so small form factors get a fluid, narrower island instead of settings
  // clipped at the screen edges. Under Tauri the window is sized to the island
  // (see syncWindow), so `window.innerWidth` would feed back and shrink us on
  // every render — use the real screen size instead (a no-op in a browser).
  // (screen.width is in logical CSS px, matching the page's coordinate space.)
  const capW = Math.max(window.screen.width, window.screen.availWidth) - 16;
  let want = expanded ? Math.max(380, state.size.width, 460) : state.size.width;
  // While the first-run hint is up it replaces the idle content, so size the
  // pill to the hint's own width — otherwise the fixed island width clips it.
  if (!expanded && firstHintActive) {
    const hh = island.querySelector(".first-hint");
    if (hh) want = hh.scrollWidth + 52; // LED + gaps + strip padding
  }
  want = Math.min(want, capW);
  island.style.width = want + "px";

  if (!expanded) {
    island.style.height = "36px";
    island.style.borderRadius = state.shape === "notch" ? "0 0 22px 22px" : "999px";
    return;
  }
  island.style.borderRadius = state.shape === "notch" ? "0 0 30px 30px" : "32px";

  // Measure the real panel content height, then pin the morph target.
  // The panel-body is an internal scroll container (overflow-y: auto), so a
  // squeezed island would report only the strip + panel head (~85px) and
  // clip every widget — the content only lays out at its natural size, so
  // the measurement MUST detour through height:"auto". But a plain
  // auto→px swap kills the height spring: the transition system sees the
  // computed style jump and the panel POPPED to full height instantly
  // (while width still animated — the lopsided expand glitch). So the
  // detour is made invisible to transitions: measure with the transition
  // disabled, re-commit the start height, force a reflow so it becomes the
  // transition's "before" value, re-enable transitions, THEN set the
  // target. The spring then runs 36px → N px like every other property.
  const pb = island.querySelector(".panel-body");
  // Clearing max-height below momentarily fits the whole content, which makes
  // the browser clamp scrollTop to 0 — that would teleport the user to the top
  // on EVERY interaction. Capture the position first and restore it after the
  // measure/pin dance.
  const keepScroll = pb ? { top: pb.scrollTop, left: pb.scrollLeft } : null;
  if (pb) pb.style.maxHeight = "";
  // Same rationale as the width cap: under Tauri the window height tracks the
  // island, so cap against the real screen rather than the (shrinking) window.
  const capH = window.screen.height;
  const startH = island.style.height || "36px";
  island.style.transition = "none";
  island.style.height = "auto";
  const capped = Math.min(island.scrollHeight, Math.round(capH * 0.88));
  island.style.height = startH;
  void island.offsetHeight; // commit startH as the computed "before" value
  island.style.transition = "";
  island.style.height = capped + "px";
  if (pb) {
    // Subtract the island's full fixed chrome (strip + panel head), not just
    // the strip: under Tauri the OS window is sized to `style.height`, so any
    // overflow lands off-screen — historically clipping the sticky deck foot.
    const chrome = (document.querySelector(".island-strip")?.offsetHeight || 36)
                 + (document.querySelector(".panel-head")?.offsetHeight || 0);
    pb.style.maxHeight = Math.max(120, capped - chrome) + "px";
    if (keepScroll) {
      pb.scrollTop = keepScroll.top;
      pb.scrollLeft = keepScroll.left;
    }
  }
}

/* ---------- island position (presets + custom drag) ---------- */
function applyPosition() {
  const shell = $("#shell");
  if (!shell) return;
  // The OS window hugs the island and is placed by syncWindow() — presets
  // and arrange drags move the WINDOW, not the DOM. Keep the shell anchored
  // to the window's top edge so it can never drift or clip inside it.
  shell.style.left = "50%";
  shell.style.right = "";
  shell.style.top = "0px";
  shell.style.transform = "translateX(-50%)";
}

/** Snap the island to a position preset (immediate + persisted, like Done). */
function setPos(mode) {
  state.pos = { mode, x: 0, y: 0 };
  persist();
  // Presets move the real OS window. left/right use the backend monitor
  // geometry so the offset is exact at any DPI; default re-centers top.
  if (mode === "default") {
    syncWindow(true);
  } else {
    TAURI.core.invoke("move_island_window", { anchor: mode }).catch(() => {});
  }
  render();
}

/**
 * Factory reset — a completely fresh install. Wipes every persisted key so a
 * reload boots exactly like day one, resets ALL state (settings, position,
 * widget arrangement, notes, weather, launchers, live media/dial sims), then
 * reopens the setup wizard in its first-run mode. Guarded by the two-step
 * "tap again" confirm on the deck footer button.
 */
function factoryReset() {
  try {
    Object.keys(localStorage)
      .filter((k) => k.startsWith("winotch."))
      .forEach((k) => localStorage.removeItem(k));
  } catch {}
  Object.assign(state, defaults());
  state.pos = { mode: "default", x: 0, y: 0 };
  state.expanded = false; state.settingsOpen = false; state.addOpen = false; state.editing = null;
  state.arranging = false; state.arrangeOrigin = null;
  state.applied = false; state.dirty = false;
  widgetGhost = null;
  state.dial = { call: false, mic: false, playing: false };
  wxLive = null;
  draft = snapshot();
  render();
  openSetup("fresh");
}

/* ---------- widgets stack ---------- */
function buildWidgets() {
  const wrap = h("div", "widgets-stack");
  wrap.id = "widgets";

  // Ghost pass — an Apply changed the stack while we were in Settings. Render
  // the OLD stack first with the newly-removed cards collapsing out in place
  // (widget-removing), capture their positions, then after the collapse
  // re-render the REAL stack: survivors FLIP into their new slots and the
  // added cards get widget-in. One shot — widgetGhost is consumed here.
  const ghost = widgetGhost;
  widgetGhost = null;
  if (ghost && ghost.types.length > 0) {
    ghost.types.forEach((t) => {
      const card = buildWidgetCard(t);
      if (!state.widgets[t]) card.classList.add("widget-removing");
      wrap.appendChild(card);
    });
    setTimeout(() => {
      // Measure now, just before the swap: the ghost cards are attached and
      // the collapse (0.26s) has landed, so survivors still sit at their OLD
      // slots — exactly the rects the FLIP should glide them from. Removed
      // cards are ignored afterwards because they don't exist in the new stack.
      const before = widgetPositions();
      pendingAdds = ghost.added;
      render();
      flipWidgets(before);
    }, 320); // widget-out runs 0.26s — swap right after it lands
    return wrap;
  }

  const enabled = widgetEnabledOrder();

  if (enabled.length === 0) {
    wrap.appendChild(h("div", "widget-empty", "<b>Nothing on the island yet.</b><br>Press + in the header above to add a widget."));
    return wrap;
  }

  const entering = widgetEnter;
  widgetEnter = null;
  const adds = pendingAdds;
  pendingAdds = null;
  enabled.forEach((t) => {
    const card = buildWidgetCard(t);
    if (t === entering || (adds && adds.includes(t))) card.classList.add("widget-in");
    wrap.appendChild(card);
  });
  return wrap;
}

function cardHead(label, type) {
  const head = h("div", "widget-head");
  head.innerHTML = `<span class="led"></span><span>${label}</span>`;
  const acts = h("div", "widget-actions");
  // drag grip — the primary way to reorder; arrows stay as the precise/
  // keyboard-friendly fallback. First/last slots disable their arrows so the
  // affordance is honest, but dragging works from any slot.
  const grip = h("button", "widget-act widget-act-drag", "⠿");
  grip.title = "Drag to reorder";
  grip.setAttribute("aria-label", "Drag to reorder");
  grip.onpointerdown = (e) => dragWidgetStart(e, type);
  acts.appendChild(grip);
  // reorder arrows — first/last slots are disabled so the affordance is honest
  const enabled = widgetEnabledOrder();
  const i = enabled.indexOf(type);
  const up = h("button", "widget-act", "↑");
  up.title = "Move up";
  up.disabled = i <= 0;
  up.onclick = (e) => { e.stopPropagation(); moveWidget(type, -1); };
  const down = h("button", "widget-act", "↓");
  down.title = "Move down";
  down.disabled = i < 0 || i >= enabled.length - 1;
  down.onclick = (e) => { e.stopPropagation(); moveWidget(type, 1); };
  acts.append(up, down);
  if (type === "weather" || type === "launcher" || type === "system") {
    const gear = h("button", "widget-act", "⚙");
    gear.title = type === "system" ? "Metrics" : "Settings";
    gear.onclick = () => { state.editing = state.editing === type ? null : type; render(); };
    acts.appendChild(gear);
  }
  const x = h("button", "widget-act", "✕");
  x.title = "Remove widget";
  x.onclick = () => removeWidget(type);
  acts.appendChild(x);
  head.appendChild(acts);
  return head;
}

/* enabled widgets in display order — the source of truth for arrows + FLIP */
function widgetEnabledOrder() {
  return state.widgetOrder.filter((t) => state.widgets[t]);
}

/* ---- widget stack motion ----
   Moving uses FLIP: snapshot the current card positions, let render() build
   the new order, then start each card at its old spot and animate to rest
   with the island's spring. Add/remove set a one-shot flag consumed by
   buildWidgets (entrance) or collapse the card before swapping (exit). */
function widgetPositions() {
  const m = new Map();
  document.querySelectorAll("#widgets .widget").forEach((el) => {
    m.set(el.dataset.wtype, el.getBoundingClientRect().top);
  });
  return m;
}

function moveWidget(type, dir) {
  const enabled = widgetEnabledOrder();
  const i = enabled.indexOf(type);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= enabled.length) return;
  // swap the two types in widgetOrder
  const a = enabled[i], b = enabled[j];
  const ia = state.widgetOrder.indexOf(a), ib = state.widgetOrder.indexOf(b);
  state.widgetOrder[ia] = b;
  state.widgetOrder[ib] = a;
  persist();
  const before = widgetPositions();
  render();
  flipWidgets(before);
}

function flipWidgets(before) {
  const cards = document.querySelectorAll("#widgets .widget");
  if (!cards.length) return;
  cards.forEach((el) => {
    const from = before.get(el.dataset.wtype);
    if (from == null) return;
    const to = el.getBoundingClientRect().top;
    const dy = from - to;
    if (!dy) return;
    el.style.transition = "none";
    el.style.transform = `translateY(${dy}px)`;
  });
  // force reflow so the transforms take, then let the spring glide them home
  void document.body.offsetHeight;
  cards.forEach((el) => {
    el.style.transition = "transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1)";
    el.style.transform = "";
  });
  setTimeout(() => {
    cards.forEach((el) => {
      el.style.transition = "";
      el.style.transform = "";
    });
  }, 480);
}

/* ---- drag-to-reorder ----
   Pointer-driven: the grip starts a drag, the card is lifted out of flow
   (scale + shadow) and pinned to the pointer, and the neighbours FLIP live
   as the dragged card crosses their midpoint. On drop the card springs back
   into its slot. Reuses widgetPositions/flipWidgets so the motion matches
   the arrow reorder exactly. */
let wdrag = null; // { type, grabDy, pointerY }

function cardEl(type) {
  return document.querySelector(`#widgets .widget[data-wtype="${type}"]`);
}

function dragWidgetStart(e, type) {
  if (e.button !== 0) return;
  const card = cardEl(type);
  if (!card) return;
  e.preventDefault();
  e.stopPropagation();
  const r = card.getBoundingClientRect();
  wdrag = { type, grabDy: e.clientY - r.top, pointerY: e.clientY };
  document.body.classList.add("wdragging");
  // Lift the card out and anchor it to the pointer immediately.
  card.style.transition = "none";
  card.style.transform = "scale(1.025)";
  card.classList.add("widget-dragging");
  window.addEventListener("pointermove", dragWidgetMove, { passive: false });
  window.addEventListener("pointerup", dragWidgetEnd);
  window.addEventListener("pointercancel", dragWidgetEnd);
}

function dragWidgetMove(e) {
  if (!wdrag) return;
  e.preventDefault();
  wdrag.pointerY = e.clientY;

  // Auto-scroll the panel-body when nearing its top/bottom edge.
  const scroller = document.querySelector(".panel-body");
  if (scroller) {
    const sr = scroller.getBoundingClientRect();
    if (e.clientY < sr.top + 26) scroller.scrollTop -= 9;
    else if (e.clientY > sr.bottom - 26) scroller.scrollTop += 9;
  }

  // Where should the dragged card land? Count the cards whose midpoint sits
  // above the pointer — that's the new index. Compute from live rects so the
  // neighbours FLIP as the card crosses each midpoint.
  const enabled = widgetEnabledOrder();
  const cur = enabled.indexOf(wdrag.type);
  let target = 0;
  document.querySelectorAll("#widgets .widget").forEach((el) => {
    if (el.dataset.wtype === wdrag.type) return;
    const r = el.getBoundingClientRect();
    if (r.top + r.height / 2 < e.clientY) target++;
  });
  // Exclude the dragged card itself from the count's frame of reference.
  if (target > cur) target--;

  if (target !== cur) {
    // Commit the reorder and FLIP the neighbours around.
    const a = enabled[cur], b = enabled[target];
    const ia = state.widgetOrder.indexOf(a), ib = state.widgetOrder.indexOf(b);
    state.widgetOrder[ia] = b;
    state.widgetOrder[ib] = a;
    persist();
    const before = widgetPositions();
    render();
    flipWidgets(before);
    // Re-attach the lift to the re-rendered card and keep it under the pointer.
    const card = cardEl(wdrag.type);
    if (card) {
      card.style.transition = "none";
      card.style.transform = `translateY(${e.clientY - wdrag.grabDy - card.getBoundingClientRect().top}px) scale(1.025)`;
      card.classList.add("widget-dragging");
    }
  } else {
    // No reorder yet — just keep the card pinned to the pointer.
    const card = cardEl(wdrag.type);
    if (card) {
      card.style.transition = "none";
      card.style.transform = `translateY(${e.clientY - wdrag.grabDy - card.getBoundingClientRect().top}px) scale(1.025)`;
    }
  }
}

function dragWidgetEnd() {
  if (!wdrag) return;
  const { type } = wdrag;
  wdrag = null;
  document.body.classList.remove("wdragging");
  window.removeEventListener("pointermove", dragWidgetMove);
  window.removeEventListener("pointerup", dragWidgetEnd);
  window.removeEventListener("pointercancel", dragWidgetEnd);
  const card = cardEl(type);
  if (card) {
    // Spring back into the slot, matching the arrow-reorder glide.
    card.style.transition = "transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1)";
    card.style.transform = "";
    card.classList.remove("widget-dragging");
    setTimeout(() => { card.style.transition = ""; }, 480);
  }
}

let widgetEnter = null;   // type added most recently — entrance anim on its card
let widgetExit = null;    // type being removed — collapse before re-render
// One-shot "ghost" pass set by the Settings Apply button: { types, added }
// holds the pre-apply widget stack so the widgets view can play the change —
// removed cards collapse out in place, survivors FLIP to their new slots, and
// freshly enabled cards drop in. Cleared the moment the ghost pass mounts.
let widgetGhost = null;
let pendingAdds = null;   // types to mark widget-in on the next widgets draw

function removeWidget(type) {
  const card = document.querySelector(`#widgets .widget[data-wtype="${type}"]`);
  if (card) {
    widgetExit = type;
    card.classList.add("widget-removing");
    const commit = () => {
      if (widgetExit !== type) return;
      widgetExit = null;
      const before = widgetPositions();
      state.widgets[type] = false;
      state.widgetOrder = state.widgetOrder.filter((t) => t !== type);
      if (state.editing === type) state.editing = null;
      persist();
      render();
      flipWidgets(before);
    };
    card.addEventListener("animationend", commit, { once: true });
    // safety net if the animation never fires
    setTimeout(() => { if (widgetExit === type) commit(); }, 400);
  } else {
    state.widgets[type] = false;
    state.widgetOrder = state.widgetOrder.filter((t) => t !== type);
    if (state.editing === type) state.editing = null;
    persist();
    render();
  }
}

function addWidget(type) {
  if (state.widgets[type]) return;
  state.widgets[type] = true;
  if (!state.widgetOrder.includes(type)) state.widgetOrder.push(type);
  state.addOpen = false;
  widgetEnter = type;
  persist();
  render();
}

function buildWidgetCard(type) {
  const card = h("div", "widget widget-" + type);
  card.dataset.wtype = type;

  if (type === "clock") {

      <span class="big"><span class="lead">${esc(t.lead)}</span><span class="colon" aria-hidden>:</span><span class="tail">${esc(t.tail)}</span></span>
      <span class="date">${esc(now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }))}</span>`;
    card.appendChild(cw);
    return card;
  }

  if (type === "system") {
    if (state.editing === "system") {
      const ed = h("div", "widget-edit");
      ed.appendChild(h("p", "widget-edit-hint", "Which metrics to show"));
      [

      });

  if (type === "media") {
    const mm = h("div", "media-meta");
    const bar = h("div", "media-bar");
    const time1 = h("span", "media-time", "0:00");
    const time2 = h("span", "media-time", "0:00");
    const ctl = h("div", "media-ctl");

    prev.onclick = () => mediaCommand("media_previous");
    next.onclick = () => mediaCommand("media_next");

    prog.append(time1, bar, time2);
    card.append(mm, prog, ctl);

      bar.innerHTML = `<i style="width:${t.dur > 0 ? ((t.pos / t.dur) * 100).toFixed(1) : 0}%"></i>`;

      play.textContent = t.playing ? "❚❚" : "▶";
    };

  if (type === "notes") {
    const ta = document.createElement("textarea");
    ta.className = "notes-input";
    ta.placeholder = "Jot something down…";

    const cnt = h("div", "notes-count", state.notes.length + " chars");

  if (type === "weather") {

      const ed = h("div", "widget-edit");

      const input = document.createElement("input");

      input.value = state.weather.city;
      const save = h("button", "widget-btn widget-btn-primary", "Save");
      save.onclick = () => saveWeather(input.value, ed);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") saveWeather(input.value, ed); });
      row.append(input, save);
      ed.appendChild(row);
      // Skip typing a city — ask the OS where the device is.

    }
    const wd = weatherData();
    if (!wd) {

      const auto = h("button", "widget-btn widget-btn-primary", "📌 Detect my location");
      auto.onclick = () => {
        auto.disabled = true;
        auto.textContent = "Locating…";
        useOsLocation(null, auto);
      };
      const set = h("button", "widget-btn", "Enter a city");
      set.style.marginTop = "6px";
      set.onclick = () => { state.editing = "weather"; render(); };
      card.appendChild(auto);
      card.appendChild(set);
      return card;
    }
    card.appendChild(h("div", "weather-main",
      `<span class="weather-emoji">${wd.emoji}</span><span class="weather-temp">${Math.round(wd.temp)}°</span>`));
    card.appendChild(h("div", "weather-meta",
      `${esc(wd.label)} · feels <b>${Math.round(wd.feels)}°</b> · H <b>${Math.round(wd.max)}°</b> L <b>${Math.round(wd.min)}°</b>`));
    card.appendChild(h("div", "weather-city", esc(state.weather.city)));

  if (type === "launcher") {
    if (state.editing === "launcher") {
      card.appendChild(buildLauncherEdit());

    if (apps.length === 0) {
      card.appendChild(h("div", "widget-edit", '<p class="widget-edit-hint">No apps yet. Open the ⚙ on this card to add some.</p>'));

      tile.onclick = () => {
        TAURI.core.invoke("launch_app", { path: a.path })

          .catch(() => toast("Couldn't launch " + a.label + " — check the path in settings", "err"));
      };
      grid.appendChild(tile);
    });
    card.appendChild(grid);
    return card;

  if (type === "focus") {
    const t = state.focusTimer;
    if (state.editing === "focus") {
      const ed = h("div", "widget-edit");
      ed.appendChild(h("p", "widget-edit-hint", "Session length"));
      const seg = h("div", "segmented");
      [["25", "25 / 5"], ["50", "50 / 10"], ["custom", "Custom"]].forEach(([k, lab]) => {
        const b = h("button", "widget-btn" + (t.preset === k ? " widget-btn-primary" : ""), lab);
        b.onclick = () => { t.preset = k; focusSave(); render(); };
        seg.appendChild(b);
      });
      ed.appendChild(seg);
      if (t.preset === "custom") {
        const mkRow = (label, key, dflt, min, max) => {
          const row = h("div", "row");
          row.innerHTML = `<span class="row-label">${label}</span>`;
          const inp = h("input", "widget-input");
          inp.type = "number"; inp.min = min; inp.max = max; inp.value = t[key];
          inp.onchange = () => { t[key] = Math.min(max, Math.max(min, Math.round(+inp.value) || dflt)); focusSave(); render(); };
          row.appendChild(inp);
          return row;
        };
        ed.appendChild(mkRow("Focus (min)", "focusMin", 25, 1, 180));
        ed.appendChild(mkRow("Break (min)", "breakMin", 5, 1, 60));
      }
      const row = h("div", "row");
      row.innerHTML = `<span class="row-label">Auto-cycle focus → break</span>`;
      const sw = h("button", "switch" + (t.autoCycle ? " on" : ""));
      sw.onclick = () => { t.autoCycle = !t.autoCycle; focusSave(); render(); };
      row.appendChild(sw);
      ed.appendChild(row);
      card.appendChild(ed);
      return card;
    }
    const active = t.status !== "stopped";
    const wrap = h("div", "focus-widget");
    const phaseLabel = active
      ? (t.phase === "focus" ? (t.status === "paused" ? "Focus · paused" : "Focus") : "Break")
      : "Ready";
    wrap.innerHTML =
      `<div class="focus-top"><span class="focus-phase">${phaseLabel}</span>` +
      `<span class="focus-rem">${active ? focusFmt(focusRemaining()) : (t.preset === "custom" ? t.focusMin + " min" : t.preset + " min")}</span></div>` +
      `<div class="focus-bar"><i style="width:${active ? (focusProgress() * 100).toFixed(1) : 0}%"></i></div>` +
      `<div class="focus-actions">${active
        ? `<button class="widget-btn" data-fa="pp">${t.status === "paused" ? "Resume" : "Pause"}</button>` +
          `<button class="widget-btn" data-fa="skip">Skip</button>` +
          `<button class="widget-btn widget-btn-danger" data-fa="stop">Stop</button>`
        : `<button class="widget-btn widget-btn-primary" data-fa="start">Start</button>` +
          `<button class="widget-btn" data-fa="cfg">⚙</button>`}</div>`;
    const fa = (k, fn) => { const b = wrap.querySelector('[data-fa="' + k + '"]'); if (b) b.onclick = fn; };
    fa("start", focusStart);
    fa("pp", focusPauseResume);
    fa("skip", focusSkip);
    fa("stop", focusStop);
    fa("cfg", () => { state.editing = "focus"; render(); });
    card.appendChild(wrap);
    return card;
  }

  if (type === "clipboard") {
    const wrap = h("div", "clipboard-widget");
    const items = state.clipboardItems;
    if (!items.length) {
      wrap.appendChild(h("p", "widget-empty",
        "Copied text, files and images appear here — <b>in memory only</b>, cleared when Winotch exits."));
    } else {
      const list = h("div", "clip-list");
      items.slice(0, 6).forEach((it) => {

        const text = it.text || "";

          ? esc(String(text).slice(0, 56)) + (String(text).length > 56 ? "…" : "")
          : it.kind === "files"
            ? (it.files || []).map((f) => esc(String(f).split(/[\\/]/).pop())).join(", ")
            : "Image";
        row.innerHTML =
          (it.thumb ? `<img class="clip-thumb" src="data:image/png;base64,${it.thumb}">` : `<span class="clip-ico">${it.kind === "text" ? "📄" : "📁"}</span>`) +
          `<span class="clip-txt" title="${esc(text || (it.files || []).join(", "))}">${preview}</span>` +
          `<button class="widget-act" data-ca="copy" title="Copy again">⧉</button>` +
          `<button class="widget-act" data-ca="del" title="Remove">✕</button>`;
        row.querySelector('[data-ca="copy"]').onclick = () => clipAction("clipboard_copy", it.id);
        row.querySelector('[data-ca="del"]').onclick = () => clipAction("clipboard_delete", it.id);
        list.appendChild(row);
      });
      wrap.appendChild(list);
      const foot = h("div", "clip-foot");
      const clr = h("button", "widget-btn", "Clear history");
      clr.onclick = () => clipAction("clipboard_clear", 0);
      foot.appendChild(clr);
      wrap.appendChild(foot);
    }
    card.appendChild(wrap);
    return card;
  }

  return card;
}

function initial(s) { return s.trim().charAt(0).toUpperCase() || "•"; }

function buildLauncherEdit() {
  const ed = h("div", "widget-edit");
  const hint = h("p", "widget-edit-hint", "App shortcuts");
  ed.appendChild(hint);

  const list = h("div", "launcher-list");
  const paint = () => {
    list.innerHTML = "";
    state.launcherApps.forEach((a, i) => {
      const row = h("div", "launcher-row",
        `<span class="launcher-row-name">${esc(a.label)}</span><span class="launcher-row-path">${esc(a.path)}</span>`);
      const rm = h("button", "widget-btn widget-btn-danger", "✕");
      rm.onclick = () => {
        state.launcherApps = state.launcherApps.filter((_, j) => j !== i);
        persist();
        paint();
      };
      row.appendChild(rm);
      list.appendChild(row);
    });
  };
  paint();
  ed.appendChild(list);

  const row = h("div", "widget-edit-row");
  const label = document.createElement("input");
  label.className = "widget-input";
  label.placeholder = "Name (optional)";
  label.style.flex = "0 0 90px";
  const path = document.createElement("input");
  path.className = "widget-input";
  path.placeholder = "App path or name, e.g. chrome.exe";
  const add = h("button", "widget-btn widget-btn-primary", "Add");
  const doAdd = () => {
    const p = path.value.trim();
    if (!p) return;
    const nm = label.value.trim() || p.split(/[\\/]/).pop() || p;
    state.launcherApps = [...state.launcherApps, { label: nm, path: p }];
    label.value = ""; path.value = "";
    persist();
    paint();
  };
  add.onclick = doAdd;
  path.addEventListener("keydown", (e) => { if (e.key === "Enter") doAdd(); });
  row.append(label, path, add);
  ed.appendChild(row);

  const quick = h("div", "launcher-quick");
  QUICK_APPS.forEach((a) => {
    if (state.launcherApps.some((x) => x.path === a.path)) return;
    const chip = h("button", "chip", "+ " + a.label);
    chip.onclick = () => {
      state.launcherApps = [...state.launcherApps, { ...a }];
      persist();
      paint();
    };
    quick.appendChild(chip);
  });
  ed.appendChild(quick);
  return ed;
}

/* ---------- weather ---------- */
let wxLive = null;

function weatherData() {
  // Data is only meaningful when a location is set — otherwise a stale
  // wxLive (e.g. from a previous session's coordinates) would render with
  // an empty city label.
  if (!state.weather || typeof state.weather.lat !== "number") return null;
  return wxLive;
}

function saveWeather(city, ed) {
  const errEl = ed.querySelector(".weather-err");
  const btn = ed.querySelector(".widget-btn-primary");
  const c = (city || "").trim();
  if (!c) { if (errEl) errEl.textContent = "Enter a city name first."; return; }
  btn.disabled = true;
  if (errEl) errEl.textContent = "";
  btn.textContent = "…";
  fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(c)}&count=1&language=en&format=json`)
    .then((r) => { if (!r.ok) throw new Error("geo"); return r.json(); })
    .then((j) => {
      const hit = j.results && j.results[0];
      if (!hit) throw new Error("not found");
      state.weather = { city: hit.name + (hit.admin1 ? ", " + hit.admin1 : ""), lat: hit.latitude, lon: hit.longitude, osLocation: false };
      return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}&current=temperature_2m,weather_code,apparent_temperature&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
    })
    .then((r) => r.json())
    .then((j) => {
      const cur = j.current ?? {};
      const daily = j.daily ?? {};
      wxLive = {
        ...mapWeather(cur.weather_code ?? 0),
        temp: cur.temperature_2m ?? 0,
        feels: cur.apparent_temperature ?? cur.temperature_2m ?? 0,
        max: daily.temperature_2m_max?.[0] ?? 0,
        min: daily.temperature_2m_min?.[0] ?? 0,
      };
      state.editing = null;
      state.addOpen = false;
      persist();
      render();
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = "Save";
      if (errEl) errEl.textContent = "Couldn't find that place (offline?) — try again or use Windows location.";
    });
}

/* Fetch + render weather for an explicit lat/lon. Name is display-only; when
   omitted (OS-location flow) a readable city name is resolved from the
   coordinates via Open-Meteo's reverse geocoding, falling back to "My location". */
function loadWeatherAt(lat, lon, name, ed, restoreBtn) {
  const withName = (cityName) => {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,apparent_temperature&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`)
      .then((r) => { if (!r.ok) throw new Error("forecast"); return r.json(); })
      .then((j) => {
        const cur = j.current ?? {};
        const daily = j.daily ?? {};
        wxLive = {
          ...mapWeather(cur.weather_code ?? 0),
          temp: cur.temperature_2m ?? 0,
          feels: cur.apparent_temperature ?? cur.temperature_2m ?? 0,
          max: daily.temperature_2m_max?.[0] ?? 0,
          min: daily.temperature_2m_min?.[0] ?? 0,
        };
        state.weather = { city: cityName, lat, lon, osLocation: !name };
        if (ed) { state.editing = null; }
        state.addOpen = false;
        persist();
        render();
      })
      .catch(() => {
        if (restoreBtn) { restoreBtn.disabled = false; restoreBtn.textContent = "📌 Use Windows location"; }
        toast("Weather lookup failed — check your connection", "err");
      });
  };
  if (name) { withName(name); return; }
  // Reverse-geocode the coordinates into a place name (best effort — the
  // forecast itself does not depend on this succeeding).
  fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1&language=en&format=json`)
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => {
      const hit = j && j.results && j.results[0];
      withName((hit && (hit.name + (hit.admin1 ? ", " + hit.admin1 : ""))) || "My location");
    })
    .catch(() => withName("My location"));
}

/* Auto-detect: ask the OS where the device is and load that weather.
   Used by the editor button and by the silent first-run auto-detect. */
function useOsLocation(ed, restoreBtn) {
  TAURI.core.invoke("weather_geo")
    .then((g) => loadWeatherAt(g.lat, g.lon, null, ed, restoreBtn))
    .catch((err) => {
      if (restoreBtn) { restoreBtn.disabled = false; restoreBtn.textContent = "📌 Use Windows location"; }
      toast(String(err).replace(/[^\x20-\x7e]/g, "").trim() || "Location unavailable", "err");
    });
}

/* Auto-refresh every 15 minutes. When the location came from the OS, re-resolve
   it too (so a laptop that moved cities follows along); a manually-typed city
   just re-fetches its fixed coordinates. */
setInterval(() => {
  if (!state.widgets.weather) return;
  if (state.weather && state.weather.osLocation) {
    useOsLocation(null, null);
  } else if (state.weather && typeof state.weather.lat === "number" && typeof state.weather.lon === "number") {
    loadWeatherAt(state.weather.lat, state.weather.lon, state.weather.city);
  }
}, 15 * 60 * 1000);

/* First-run auto-detect: once per boot, if the weather widget is enabled and
   no location has ever been set (and the user hasn't declined), silently ask
   the OS and load that location. Skipped when location access is off — the
   widget keeps its "Set location" card as the guide instead of nagging. */
let osLocationTried = false;
function maybeAutoDetectLocation() {
  if (osLocationTried) return;
  if (!state.widgets.weather) return;
  if (state.weather && (typeof state.weather.lat === "number" || state.weather.cityDismissed)) return;
  osLocationTried = true;
  TAURI.core.invoke("weather_geo")
    .then((g) => loadWeatherAt(g.lat, g.lon, null, null, null))
    .catch(() => {
      // Permission denied / location off — remember so we don't re-ask on
      // every boot; the widget shows its "Set location" card instead.
      state.weather = state.weather || {};
      state.weather.cityDismissed = true;
      persist();
    });
}

/* ---------- custom dropdown ---------- */
let nsOpenWrap = null;

function closeNotchSelect() {
  if (!nsOpenWrap) return;
  const pop = nsOpenWrap.querySelector(".ns-pop");
  if (pop) pop.remove();
  const trig = nsOpenWrap.querySelector(".ns-trigger");
  if (trig) trig.setAttribute("aria-expanded", "false");
  nsOpenWrap = null;
  if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("ns-opt")) {
    document.activeElement.blur();
  }
}

function toggleNotchSelect(trig, onPick) {
  const wrap = trig.closest(".notch-select");
  if (nsOpenWrap === wrap) { closeNotchSelect(); return; }
  closeNotchSelect();

  const pop = h("div", "ns-pop");
  pop.setAttribute("role", "listbox");
  NS_OPTIONS.forEach(([v, lab]) => {
    const on = draft.idleContent === v;
    const o = h("button", "ns-opt" + (on ? " on" : ""), lab);
    o.type = "button";
    o.setAttribute("role", "option");
    o.setAttribute("aria-selected", String(on));
    o.addEventListener("click", (ev) => { ev.stopPropagation(); closeNotchSelect(); onPick(v); });
    pop.appendChild(o);
  });
  wrap.appendChild(pop);
  nsOpenWrap = wrap;
  trig.setAttribute("aria-expanded", "true");

  // open upward if the popup would run past the bottom edge
  const rect = wrap.getBoundingClientRect();
  if (rect.bottom + pop.offsetHeight + 12 > window.innerHeight) pop.classList.add("up");

  // put focus on the selected option so arrows/Enter work immediately
  const sel = pop.querySelector(".on") || pop.firstElementChild;
  if (sel) sel.focus();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, kind) {
  let t = $("#toast");
  if (!t) { t = h("div", "toast", ""); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  // "ok" (default, accent) | "err" (alarm) | "info" (plain)
  if (kind === "err" || kind === "ok") t.dataset.kind = kind; else delete t.dataset.kind;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), kind === "err" ? 2600 : 1800);
}

/* ---------- focus timer (ported from the reference Winotch) ---------- */
// 25/5, 50/10 or custom 1..180 min sessions; pause/resume/skip/stop with
// optional auto-cycle; persists across restarts; completion toasts + phase
// swap, exactly like FocusTimerState in the reference. Pure frontend state
// machine — no backend involved.
const focusFmt = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
function focusPhaseMin() { const t = state.focusTimer; return t.phase === "focus" ? t.focusMin : t.breakMin; }
function focusElapsed() {
  const t = state.focusTimer;
  return t.pausedAt ? t.pausedElapsed : (Date.now() - t.startedAt) + t.pausedElapsed;
}
function focusRemaining() {
  const t = state.focusTimer;
  if (t.status === "stopped") return 0;
  return Math.max(0, focusPhaseMin() * 60000 - focusElapsed());
}
function focusProgress() {
  const t = state.focusTimer;
  const dur = focusPhaseMin() * 60000;
  if (t.status === "stopped" || dur <= 0) return 0;
  return Math.min(1, Math.max(0, focusElapsed() / dur));
}
function focusSave() { store.save("focusTimer", state.focusTimer); }
function focusStart() {
  const t = state.focusTimer;
  if (t.preset === "25") { t.focusMin = 25; t.breakMin = 5; }
  else if (t.preset === "50") { t.focusMin = 50; t.breakMin = 10; }
  t.status = "running"; t.phase = "focus"; t.startedAt = Date.now();
  t.pausedElapsed = 0; t.pausedAt = null;
  focusSave(); render();
}
function focusPauseResume() {
  const t = state.focusTimer;
  if (t.status === "running") {
    t.pausedElapsed += Date.now() - t.startedAt;
    t.pausedAt = Date.now(); t.status = "paused";
  } else if (t.status === "paused") {
    t.startedAt = Date.now(); t.pausedAt = null; t.status = "running";
  }
  focusSave(); render();
}
function focusAdvance() {
  // complete the current phase (focus -> break, break -> focus or stop)
  const t = state.focusTimer;
  if (t.phase === "focus") {
    t.phase = "break";
    t.cycles += 1;
    statusToast({ icon: "🍅", title: "Focus complete", body: "Take a " + t.breakMin + " min break" });
  } else if (t.autoCycle) {
    t.phase = "focus";
    statusToast({ icon: "⏰", title: "Break over", body: "Back to focus" });
  } else {
    t.status = "stopped"; t.phase = "focus";
    statusToast({ icon: "✅", title: "Session complete", body: t.cycles + " focus " + (t.cycles === 1 ? "cycle" : "cycles") + " finished" });
    focusSave(); render(); return;
  }
  t.startedAt = Date.now(); t.pausedElapsed = 0; t.pausedAt = null;
  focusSave(); render();
}
function focusSkip() {
  const t = state.focusTimer;
  if (t.status === "stopped") return;
  if (t.status === "paused") { t.pausedElapsed += Date.now() - t.startedAt; t.pausedAt = null; }
  focusAdvance();
}
function focusStop() {
  const t = state.focusTimer;
  t.status = "stopped"; t.phase = "focus"; t.startedAt = 0; t.pausedElapsed = 0; t.pausedAt = null;
  focusSave(); render();
}
function focusTick() {
  const t = state.focusTimer;
  if (t.status !== "running") return;
  if (focusRemaining() > 0) {
    const el = $("#island .focus-rem");
    if (el) el.textContent = focusFmt(focusRemaining());
    const bar = $("#island .focus-bar i");
    if (bar) bar.style.width = (focusProgress() * 100).toFixed(1) + "%";
    return;
  }
  focusAdvance();
}

/* ---------- status toasts (priority alerts + media/timer notices) ---------- */
// Rendered as a compact pill hanging below the notch; the OS window grows to
// fit it via syncWindow and shrinks back on dismiss. Queue is capped so a
// burst of alerts (charger + wifi + mic) can't pile up forever.
const statusQueue = [];
let statusToastEl = null;
let statusToastTimer = null;
function statusToast(a) {
  if (statusQueue.length > 4) statusQueue.splice(0, statusQueue.length - 4);
  statusQueue.push(a);
  if (!statusToastEl) pumpStatusToast();
}
function pumpStatusToast() {
  const a = statusQueue.shift();
  if (!a) return;
  clearTimeout(statusToastTimer);
  let t = statusToastEl;
  if (!t) { t = h("div", "status-toast", ""); t.id = "statusToast"; document.body.appendChild(t); statusToastEl = t; }
  const island = $("#island");
  t.style.top = (island ? island.offsetHeight : 36) + 8 + "px";
  t.innerHTML = `<span class="st-ico">${esc(a.icon || "🔔")}</span>` +
    `<span class="st-body"><b>${esc(a.title)}</b><span>${esc(a.body)}</span></span>`;
  if (a.flourish) {
    const fill = h("div", "st-fill", '<i style="width:0%"></i>');
    t.appendChild(fill);
    const bar = fill.firstElementChild;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = Math.min(100, Math.max(0, a.percent ?? 0)) + "%"; }));
  }
  syncWindow(true);
  statusToastTimer = setTimeout(() => {
    if (!t.isConnected) return;
    t.classList.add("out");
    setTimeout(() => {
      t.remove();
      if (statusToastEl === t) statusToastEl = null;
      syncWindow(true);
      pumpStatusToast();
    }, 200);
  }, a.flourish ? 3400 : 3000);
}

/* ---------- clipboard history (in-memory, from the backend) ---------- */
function setClipboardList(list) {
  state.clipboardItems = list || [];
  if (state.widgets.clipboard && state.expanded && !SETTINGS_VIEW) render();
}
function clipAction(cmd, id) {
  if (!TAURI) return;
  TAURI.core.invoke(cmd, { id }).then((list) => {
    state.clipboardItems = list || [];
    if (state.widgets.clipboard && !SETTINGS_VIEW) render();
  }).catch(() => {});
}

/* ---------- first-run hint ---------- */
// Rendered inside the collapsed pill: the OS window hugs the island, so any
// guidance drawn outside it would be clipped away. Auto-dismisses after a
// while, or instantly on first real interaction.
// One-shot per-launch sweep. Suppressed on a brand-new install (the render at
// boot would play it behind the setup wizard); the wizard's "Get started"
// re-arms it so the shine greets the pill right after setup instead.
let bootSweep = !!state.onboarded;
let firstHintActive = false;
let firstHintTimer = null;
function firstHintSeen() { return store.load("hintSeen", false); }
function dismissFirstHint(save) {
  if (!firstHintActive) return;
  firstHintActive = false;
  clearTimeout(firstHintTimer);
  if (save) store.save("hintSeen", true);
  if (!state.expanded && !state.arranging) render();
}
function maybeFirstHint() {
  if (firstHintSeen() || firstHintActive) return;
  firstHintActive = true;
  clearTimeout(firstHintTimer);
  firstHintTimer = setTimeout(() => dismissFirstHint(true), 12000);
  if (!state.expanded && !state.arranging) render();
}

function systemRows() {
  const m = state.sysMetrics;
  const row = (label, pct, val, hot) => `
    <div class="sys-row${hot ? " hot" : ""}">
      <span class="sys-label">${label}</span>
      <span class="sys-bar"><i style="width:${Math.max(2, Math.min(100, pct))}%"></i></span>
      <span class="sys-value">${val}</span>

  let s = "";
  if (m.cpu) s += row("CPU", stats.cpu, Math.round(stats.cpu) + "%", stats.cpu > 82);
  if (m.temp && stats.temp != null) s += row("TEMP", Math.max(2, ((stats.temp - 35) / 55) * 100), Math.round(stats.temp) + "°", stats.temp > 75);
  if (m.mem) s += row("MEM", stats.mem, Math.round(stats.mem) + "%");
  if (m.bat && stats.bat != null) s += row("BAT", stats.bat, Math.round(stats.bat) + "%", stats.bat < 20);
  if (m.net && stats.netDown != null) s += row("NET", 45, "↓" + (stats.netDown > 1024 ? (stats.netDown / 1024).toFixed(1) + "M" : Math.round(stats.netDown) + "k") + " ↑" + (stats.netUp != null ? stats.netUp.toFixed(1) : "0") + "k");

}

        </div>`).join("")}` : ""}
  `));

  /* actions — sticky bar: Reset-to-default on the left, draft actions right.
     The link lives IN the bar (not at the end of the long scroll) so it's
     always visible. When a gradient skin is on, the bar layers the same
     gradient over its base so it matches the island instead of staying flat. */
  const foot = h("div", "deck-foot");
  if (state.gradient !== "none") {
