<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Winotch — instrument deck (live)</title>
<style>
  :root {
    color-scheme: dark;

    /* ink — display black, cool, the room-glow */
    --ink: #0a0d14;
    --ink-2: #0e131d;
    --panel: #10151f;
    --panel-2: #141a26;

    /* instrument white / steel */
    --text: #e9edf4;
    --text-2: #9aa7bb;
    --text-3: #5d6b80;

    /* the LED — Fluent blue, the Windows material */
    --accent: #4fc3ff;
    --accent-strong: rgba(79, 195, 255, 0.32);
    --accent-soft: rgba(79, 195, 255, 0.14);
    --led-strong: #7cd4ff;
    --on-accent: #06121c;

    /* status LEDs */
    --ok: #3ddc97;
    --alarm: #ff6b6b;
    --warn: #ffc14d;

    --hairline: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.16);

    --glass-1: rgba(255, 255, 255, 0.045);
    --glass-2: rgba(255, 255, 255, 0.075);

    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    --ui: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;

    --glass-opacity: 0.65;
    --glass-blur: 14px;

    /* one-shot launch sweep across the collapsed pill */
    --sweep-hi: rgba(255, 255, 255, 0.16);
    --sweep-lo: rgba(255, 255, 255, 0.05);
  }

  :root[data-theme="light"] {
    color-scheme: light;

    --ink: #eef1f6;
    --ink-2: #e7ebf2;
    --panel: #ffffff;
    --panel-2: #f6f8fb;

    --text: #10151f;
    --text-2: #4a5568;
    --text-3: #8b96a8;

    --accent: #0078d4;
    --accent-strong: rgba(0, 120, 212, 0.28);
    --accent-soft: rgba(0, 120, 212, 0.12);
    --led-strong: #0067b8;
    --on-accent: #ffffff;

    --ok: #0e8a5f;
    --alarm: #c42b1c;
    --warn: #b46a00;

    --hairline: rgba(10, 13, 20, 0.08);
    --border: rgba(10, 13, 20, 0.12);
    --border-strong: rgba(10, 13, 20, 0.22);

    --glass-1: rgba(10, 13, 20, 0.03);
    --glass-2: rgba(10, 13, 20, 0.06);

    /* one-shot launch sweep — white gloss reads on light glass */
    --sweep-hi: rgba(255, 255, 255, 0.6);
    --sweep-lo: rgba(255, 255, 255, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--ui);
    color: var(--text);
    /* Transparent in the notch window (the pill floats over the desktop;
       an opaque paint here is the "black box" that flashes around the
       rounded island during resize/expand). The settings window is a normal
       opaque window and re-paints its own background via body.settings-view. */
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }


  /* ================= the island ================= */
  .island-shell {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }

  .island {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    will-change: width, height, border-radius;
    backface-visibility: hidden;
    /* Layer isolation + padding-box clip keep the GPU compositor from
       painting a square dark bounding box outside the rounded corners while
       width/height animate alongside backdrop-filter. */
    isolation: isolate;
    background-clip: padding-box;
    transform-origin: top center;
    transition: width 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.25s ease;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(21, 26, 36, 0.94), rgba(13, 17, 25, 0.96));
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  :root[data-theme="light"] .island {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(238, 241, 246, 0.97));
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .island.glass {
    background: linear-gradient(180deg,
        rgb(26 28 34 / calc(0.5 * var(--glass-opacity))) 0%,
        rgb(10 12 16 / calc(0.62 * var(--glass-opacity))) 55%,
        rgb(7 9 13 / calc(0.68 * var(--glass-opacity))) 100%);
    backdrop-filter: blur(calc(var(--glass-blur)));
    -webkit-backdrop-filter: blur(calc(var(--glass-blur)));
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.09);
  }
  :root[data-theme="light"] .island.glass {
    background: linear-gradient(180deg,
        rgb(255 255 255 / calc(0.55 * var(--glass-opacity))) 0%,
        rgb(250 250 252 / calc(0.65 * var(--glass-opacity))) 55%,
        rgb(240 240 246 / calc(0.72 * var(--glass-opacity))) 100%);
  }

  /* frosted: a heavier, milkier blur — the surface reads as etched glass.
     Deliberately much lighter than the plain glass so the two are distinct. */
  .island.glass.frosted {
    background: linear-gradient(180deg,
        rgb(212 220 234 / calc(0.62 * var(--glass-opacity))) 0%,
        rgb(180 190 208 / calc(0.7 * var(--glass-opacity))) 55%,
        rgb(162 174 196 / calc(0.76 * var(--glass-opacity))) 100%);
    backdrop-filter: blur(calc(var(--glass-blur) + 14px)) saturate(150%);
    -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 14px)) saturate(150%);
    border-color: rgba(208, 218, 234, 0.34);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(255, 255, 255, 0.12);
  }
  :root[data-theme="light"] .island.glass.frosted {
    background: linear-gradient(180deg,
        rgb(255 255 255 / calc(0.82 * var(--glass-opacity))) 0%,
        rgb(245 248 252 / calc(0.88 * var(--glass-opacity))) 55%,
        rgb(232 238 246 / calc(0.94 * var(--glass-opacity))) 100%);
    border-color: rgba(120, 140, 170, 0.3);
  }

  /* App-only (real window hugs the island): kill the outer drop shadow.
     It extends ~28px past the rounded pill and the rectangular OS window
     clips it into a dark fringe/box around the notch. Inset highlights are
     kept — they light the pill's edge without escaping its bounds. The
     standalone demo (no .tauri class) keeps the shadow on its fake desktop. */
  :root.tauri .island,
  :root.tauri .island.glass,
  :root.tauri .island.glass.frosted {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
  }
  :root.tauri[data-theme="light"] .island,
  :root.tauri[data-theme="light"] .island.glass,
  :root.tauri[data-theme="light"] .island.glass.frosted {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .island-grad { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
  .grad-aurora { background: linear-gradient(160deg, rgba(16, 185, 129, 0.42) 0%, rgba(37, 99, 235, 0.1) 45%, rgba(139, 92, 246, 0.18) 100%); }
  .grad-sunset { background: linear-gradient(160deg, rgba(255, 122, 89, 0.5) 0%, rgba(239, 68, 68, 0.14) 45%, rgba(168, 85, 247, 0.2) 100%); }
  .grad-ocean { background: linear-gradient(160deg, rgba(14, 165, 233, 0.44) 0%, rgba(37, 99, 235, 0.12) 50%, rgba(6, 182, 212, 0.22) 100%); }
  .grad-candy { background: linear-gradient(160deg, rgba(236, 72, 153, 0.44) 0%, rgba(168, 85, 247, 0.13) 50%, rgba(59, 130, 246, 0.18) 100%); }
  .grad-graphite { background: linear-gradient(160deg, rgba(148, 163, 184, 0.3) 0%, rgba(100, 116, 139, 0.1) 55%, rgba(71, 85, 105, 0.22) 100%); }

  /* the strip — the pill's face. The LED + idle content cluster is centered
     as one unit so every idle state (clock, brand, stats, call, now playing,
     custom text, arrange) sits balanced in the pill. */
  .island-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 36px;
    padding: 0 14px;
    flex: 0 0 36px;
    cursor: default;
    position: relative;
    z-index: 2;
  }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-3);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.15);
    flex: none;
  }
  .led[data-call="on"] { background: var(--ok); box-shadow: 0 0 8px rgba(61, 220, 151, 0.7); animation: breathe 2.4s ease-in-out infinite; }
  .led[data-mic="on"] { background: var(--alarm); box-shadow: 0 0 8px rgba(255, 107, 107, 0.6); animation: breathe 1.8s ease-in-out infinite; }
  .led[data-call="on"][data-mic="on"] { background: #5bc8ff; box-shadow: 0 0 8px rgba(91, 200, 255, 0.6); }
  .led.playing { background: var(--accent); box-shadow: 0 0 8px var(--accent-strong); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.55; } }

  .brand {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-2);
    white-space: nowrap;
  }

  .divider { width: 1px; height: 14px; background: var(--hairline); flex: none; }

  .clock {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .clock-time { font-size: 14px; font-weight: 500; letter-spacing: 0.02em; color: var(--text); }
  .clock .colon { color: var(--accent); animation: colon-blink 1s steps(1) infinite; }
  @keyframes colon-blink { 50% { opacity: 0.12; } }

  .island-custom-text { font-size: 13px; color: var(--text); white-space: nowrap; }
  .island-custom-text.is-muted { color: var(--text-3); font-style: italic; font-size: 11.5px; }

  /* arrange mode — the collapsed pill becomes a drag-to-reposition strip with
     Reset (back to default) and Done (keep this spot) instead of idle content */
  .arrange { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
  .arrange-hint {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .arrange-btn {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    cursor: pointer;
    flex: none;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .arrange-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .arrange-reset:hover { color: var(--alarm); border-color: rgba(255, 107, 107, 0.45); }
  .arrange-done { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .arrange-done:hover { background: var(--accent); color: var(--on-accent); opacity: 0.9; }

  /* call pill + mini now playing + sysmini chips */
  .call-pill { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .call-pill .tag { font-size: 9px; letter-spacing: 0.16em; color: var(--ok); text-transform: uppercase; }
  .mini-nowplaying { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mini-nowplaying .ga { color: var(--accent); font-size: 12px; }
  .mini-nowplaying .track { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .sysm { display: flex; gap: 6px; align-items: center; }
  .sysm-chip {
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--glass-2);
    color: var(--text-2);
    white-space: nowrap;
  }
  .sysm-chip b { color: var(--text); font-weight: 600; }

  /* ================= the panel ================= */
  .island-panel {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .panel-title {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-2);
  }
  .panel-head .led { box-shadow: 0 0 8px var(--accent-strong); }
  .spacer { flex: 1; }
  .icon-btn {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-3);
    font-size: 13px;
    cursor: pointer;
    display: grid;
    place-items: center;
    font-family: var(--mono);
  }
  .icon-btn:hover { background: var(--glass-2); color: var(--text); }
  .icon-btn.active { color: var(--accent); background: var(--accent-soft); }

  .panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

  /* ---- widgets stack ---- */
  .widgets-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px 14px;
  }
  .widget {
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 11px 13px;
    background: rgba(255, 255, 255, 0.02);
  }
  :root[data-theme="light"] .widget { background: rgba(255, 255, 255, 0.55); }
  .widget-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 9px;
  }
  .widget-head .led { width: 5px; height: 5px; background: var(--accent); box-shadow: 0 0 5px var(--accent-strong); }
  .widget-actions { display: flex; gap: 2px; margin-left: auto; }
  .widget-act {
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-3);
    font-size: 10px;
    cursor: pointer;
  }
  .widget-act:hover { background: var(--glass-2); color: var(--text); }
  .widget-act:disabled { opacity: 0.28; cursor: default; }
  .widget-act:disabled:hover { background: transparent; color: var(--text-3); }

  /* drag-to-reorder grip — the handle itself is a quiet dot row that warms
     on hover, and the lifted card gets a scale + shadow so it reads as out
     of flow while the neighbours FLIP around it. */
  .widget-act-drag { cursor: grab; }
  .widget-act-drag:hover { color: var(--accent); background: var(--accent-soft); }
  .widget-act-drag:active { cursor: grabbing; }
  .widget.widget-dragging {
    position: relative;
    z-index: 30;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
    background: var(--glass-1);
    will-change: transform;
  }
  body.wdragging { cursor: grabbing; }

  /* widget stack motion — entrance, exit, and FLIP glide all share the
     island's spring curve so reordering feels like the deck rearranging.
     .widget-in plays once on mount (fresh add); .widget-removing plays once
     before the card is dropped and the neighbours FLIP up into the gap. */
  .widget.widget-in {
    animation: widget-in 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes widget-in {
    0% { opacity: 0; transform: translateY(-16px); }
    55% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  .widget.widget-removing {
    animation: widget-out 0.26s ease both;
    pointer-events: none;
  }
  @keyframes widget-out {
    to { opacity: 0; transform: scale(0.966) translateY(8px); }
  }
  .widget-edit { padding: 2px 0 4px; }
  .widget-edit-hint { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
  .widget-edit-row { display: flex; gap: 6px; margin-bottom: 7px; }
  .widget-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--glass-2);
    color: var(--text);
    font-size: 11.5px;
    padding: 6px 9px;
    outline: none;
  }
  .widget-input:focus { border-color: var(--accent); }
  .widget-btn {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .widget-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .widget-btn-primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }
  .widget-btn-danger { color: var(--alarm); border-color: transparent; }
  .widget-err { font-family: var(--mono); font-size: 10px; color: var(--alarm); margin-top: 6px; }
  .widget-ok { font-family: var(--mono); font-size: 10px; color: var(--ok); margin-top: 6px; }

  /* launcher */
  .launcher-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .launcher-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    border-radius: 8px;
    background: var(--glass-1);
    border: 1px solid var(--hairline);
  }
  .launcher-row-name { font-size: 11.5px; color: var(--text); white-space: nowrap; }
  .launcher-row-path { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; text-align: right; }
  .launcher-quick { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .launcher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
  .launcher-app {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 4px 7px;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    background: var(--glass-1);
    color: var(--text-2);
    cursor: pointer;
  }
  .launcher-app:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .launcher-app:active { transform: scale(0.94); }
  .launcher-app-icon {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 8px;
    background: linear-gradient(150deg, var(--glass-2), var(--glass-1));
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
  }
  .launcher-app-label { font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }

  /* weather */
  .weather-main { display: flex; align-items: center; gap: 12px; }
  .weather-emoji { font-size: 30px; line-height: 1; }
  .weather-temp { font-family: var(--mono); font-size: 30px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; }
  .weather-meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; color: var(--text-3); margin-top: 6px; }
  .weather-meta b { color: var(--text-2); font-weight: 600; }
  .weather-city { font-size: 11px; color: var(--text-2); margin-top: 2px; }

  /* add-widget menu */
  .add-wrap { position: relative; }
  .add-menu {
    position: absolute;
    right: 0; top: 30px;
    z-index: 40;
    min-width: 150px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(24, 26, 32, 0.97), rgba(18, 20, 26, 0.97));
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    padding: 5px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  :root[data-theme="light"] .add-menu { background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 247, 251, 0.98)); }
  .add-menu button {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 12px;
    cursor: pointer;
    text-align: left;
  }
  .add-menu button:hover { background: var(--glass-2); color: var(--text); }
  .add-menu .empty { padding: 7px 10px; color: var(--text-3); font-family: var(--mono); font-size: 10.5px; }

  /* toast */
  .toast {
    position: fixed;
    left: 50%; bottom: 40px;
    transform: translate(-50%, 8px);
    z-index: 70;
    max-width: 80vw;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--accent-strong);
    background: linear-gradient(180deg, rgba(24, 26, 32, 0.95), rgba(18, 20, 26, 0.95));
    color: var(--text);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast[data-kind="err"] {
    border-color: rgba(255, 107, 107, 0.55);
    background: linear-gradient(180deg, rgba(48, 24, 30, 0.95), rgba(34, 18, 24, 0.95));
  }
  :root[data-theme="light"] .toast { background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 247, 251, 0.98)); }
  :root[data-theme="light"] .toast[data-kind="err"] {
    border-color: rgba(196, 43, 28, 0.5);
    background: linear-gradient(180deg, rgba(255, 245, 245, 0.98), rgba(252, 238, 238, 0.98));
  }

  /* status toasts — compact alert pills that hang BELOW the notch. The OS
     window grows to fit them via syncWindow; they carry priority alerts
     (battery/charger/Wi-Fi/mic-cam), media changes and focus-timer
     completions, ported from the reference Winotch. */
  .status-toast {
    position: fixed;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 10px;
    width: max-content;
    max-width: 320px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--glass-2);
    color: var(--text);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
    pointer-events: none;
    animation: toast-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  :root[data-theme="light"] .status-toast { box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16); }
  .status-toast .st-ico { font-size: 16px; flex: none; }
  .status-toast .st-body b { display: block; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .status-toast .st-body span { display: block; font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .status-toast .st-fill { position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 0 0 14px 14px; overflow: hidden; }
  .status-toast .st-fill i { display: block; height: 100%; background: var(--ok); transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
  .status-toast.out { transition: opacity 0.2s ease, transform 0.2s ease; opacity: 0; transform: translate(-50%, 6px); }
  @keyframes toast-pop { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (prefers-reduced-motion: reduce) {
    .status-toast, .status-toast.out { transition: none; animation: none; }
  }

  /* focus timer widget */
  .focus-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .focus-phase { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); }
  .focus-rem { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .focus-bar { height: 4px; border-radius: 999px; background: var(--hairline); overflow: hidden; margin: 8px 0 10px; }
  .focus-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--led-strong)); transition: width 1s linear; }
  .focus-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* clipboard history widget */
  .clip-list { display: flex; flex-direction: column; gap: 4px; }
  .clip-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--hairline); border-radius: 8px; background: rgba(255, 255, 255, 0.02); }
  :root[data-theme="light"] .clip-row { background: rgba(255, 255, 255, 0.55); }
  .clip-ico { font-size: 13px; flex: none; }
  .clip-thumb { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; flex: none; }
  .clip-txt { flex: 1; min-width: 0; font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip-foot { margin-top: 8px; display: flex; justify-content: flex-end; }

  /* first-run hint lives INSIDE the collapsed pill (the OS window hugs the
     island, so anything outside it is invisible) */
  .first-hint {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-2);
    white-space: nowrap;
    opacity: 0;
    animation: tip-reveal 0.3s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
  }
  .first-hint b { color: var(--accent); font-weight: 600; }

  /* launch sweep — a one-shot shine crossing the collapsed pill on boot, so
     the notch feels alive for returning users too (the hint covers new ones;
     this is the "I woke up" beat for everyone else). render() mounts it once
     per launch — only while collapsed, never on expand/arrange — and consumes
     the flag so re-renders can't replay it. */
  .sweep {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    animation: boot-sweep 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
  }
  .sweep::before {
    content: "";
    position: absolute;
    top: -30%;
    bottom: -30%;
    left: 0;
    width: 46%;
    transform: translateX(-150%) skewX(-10deg);
    background: linear-gradient(100deg, transparent 0%, var(--sweep-lo) 42%, var(--sweep-hi) 50%, var(--sweep-lo) 58%, transparent 100%);
    animation: boot-band 1.15s cubic-bezier(0.45, 0, 0.2, 1) 0.62s both;
  }
  @keyframes boot-sweep {
    0% { opacity: 0; }
    18%, 72% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes boot-band {
    to { transform: translateX(330%) skewX(-10deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sweep { display: none; }
  }

  /* ---- standalone settings window (view=settings) ----
     The deck fills its own normal OS window; the notch pill stays tiny. */
  body.settings-view { background: var(--ink-2); }
  body.settings-view .island-shell { display: none; } // no pill in the settings window
  .settings-root {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .settings-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px 11px;
    border-bottom: 1px solid var(--hairline);
    background: var(--panel);
    flex: none;
  }
  .settings-head .led { flex: none; }
  .settings-head-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .settings-head-title strong { color: var(--text); font-weight: 600; }
  .settings-head .spacer { flex: 1; }
  .settings-root #deck {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .settings-root #deck .deck-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 16px 14px;
  }
  .settings-root #deck .deck-foot { flex: none; }

  /* collapsed pill affordance: pointer cursor + a quiet LED glow on hover */
  .island.mode-collapsed { cursor: pointer; }
  .island.mode-collapsed:hover { border-color: var(--border-strong); }
  .island.mode-collapsed:hover .led { box-shadow: 0 0 9px var(--accent-strong); }
  .island.mode-collapsed:active { transform: scale(0.985); }

  /* slim themed scrollbars (WebView2) */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--border-strong); }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  .widget-empty {
    text-align: center;
    padding: 26px 18px;
    color: var(--text-3);
    font-size: 12px;
    line-height: 1.6;
  }
  .widget-empty b { color: var(--text-2); font-weight: 600; }

  .clock-widget { display: flex; align-items: baseline; gap: 14px; }
  .clock-widget .big {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 400;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }
  .clock-widget .big .colon { color: var(--accent); animation: colon-blink 1s steps(1) infinite; }
  .clock-widget .date { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-3); text-transform: uppercase; }

  /* system widget */
  .sys-row { display: flex; align-items: center; gap: 10px; min-height: 22px; }
  .sys-row + .sys-row { margin-top: 7px; }
  .sys-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); width: 52px; flex: none; }
  .sys-bar { flex: 1; height: 4px; border-radius: 999px; background: var(--hairline); overflow: hidden; }
  .sys-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--led-strong)); transition: width 0.6s ease; }
  .sys-row.hot .sys-bar i { background: linear-gradient(90deg, var(--warn), var(--alarm)); }
  .sys-value { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text); width: 62px; text-align: right; flex: none; }

  /* media widget */
  .media-meta { min-width: 0; }
  .media-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-artist { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-3); margin-top: 1px; }
  .media-progress { display: flex; align-items: center; gap: 10px; margin: 9px 0 6px; }
  .media-bar { flex: 1; height: 4px; border-radius: 999px; background: var(--hairline); overflow: hidden; }
  .media-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .media-time { font-family: var(--mono); font-size: 9.5px; font-variant-numeric: tabular-nums; color: var(--text-3); }
  .media-ctl { display: flex; align-items: center; gap: 6px; }
  .mbtn {
    width: 30px; height: 26px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .mbtn:hover { color: var(--text); border-color: var(--border-strong); }
  .mbtn.main { width: 34px; background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .mbtn.main:hover { background: var(--led-strong); }

  /* notes widget */
  .notes-input {
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    min-height: 74px;
  }
  .notes-input::placeholder { color: var(--text-3); }
  .notes-count { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; color: var(--text-3); text-align: right; margin-top: 2px; }

  /* ---- the deck (settings) ---- */
  .deck-scroll {
    display: flex;
    flex-direction: column;
    padding: 6px 14px 10px;
  }
  .settings-tip {
    margin: 10px 4px 12px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-3);
  }
  .settings-tip strong { color: var(--text-2); font-weight: 600; }

  /* each section is its own glass card — rounded, bordered, with air
     between neighbours. overflow stays visible so the custom dropdown
     popup (which opens inside the Idle section) can overlay freely. */
  .section {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--glass-1);
  }
  .section:last-child { margin-bottom: 2px; }
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 15px 14px 13px;
    border: none;
    border-radius: 13px;
    background: transparent;
    color: var(--text-2);
    font-family: var(--ui);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease;
  }
  .section.open .section-head { border-radius: 13px 13px 0 0; }
  .section-head:hover { background: var(--glass-2); }
  .section-mark { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex: none; transition: background 0.15s ease, box-shadow 0.15s ease; }
  .section.open .section-mark { background: var(--accent); box-shadow: 0 0 6px var(--accent-strong); }
  .section-head:hover .section-mark { background: var(--accent); box-shadow: 0 0 6px var(--accent-strong); }
  .section-titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-2);
    transition: color 0.15s ease;
  }
  .section-head:hover .section-title { color: var(--text); }
  .section-sub { font-size: 10px; letter-spacing: 0.04em; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* mount reveal — a gravity cascade when the deck first opens. The island
     hangs from the top edge and grows downward, so the content pours down
     from the same anchor: the header, then the tip, then each card drops in
     with a springy settle and an opacity-to-sharp glaze. Delayed cards
     hold the `from` state (fill-mode both) so the stack lands in order.
     The reduced-motion media query collapses this to instant. */
  .head-reveal {
    animation: head-reveal 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes head-reveal {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  .tip-reveal {
    animation: tip-reveal 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes tip-reveal {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: none; }
  }
  .section.reveal {
    animation: deck-reveal 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes deck-reveal {
    0% { opacity: 0; transform: translateY(-16px); }
    55% { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* closing exit — the gravity cascade in reverse. The header leads, then the
     tip, then each card rises up out through the top anchor with a blur fade
     while the pill's height spring runs down underneath (see collapsePanel,
     which staggers .section/.widget delays inline to override the entrance
     ones and swaps the DOM once the last card has fully exited). */
  .island.closing .panel-head { animation: deck-exit 0.16s ease-in both; }
  .island.closing .settings-tip { animation: deck-exit 0.22s ease-in both; }
  .island.closing .section,
  .island.closing .widget { animation: deck-exit 0.26s ease-in both; }
  @keyframes deck-exit {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-18px); }
  }

  /* commit acknowledgment — when Apply lands, the rows whose settings
     actually changed get a brief accent flare that blooms then dissolves, so
     the commit reads as "this just landed" instead of a silent instant swap.
     Applied per row with a small stagger (set inline at apply time), and the
     changed section's marker dot pulses in sympathy. Reduced motion collapses
     both (the media query below nukes every animation). */
  .section.applied-flash .section-mark {
    animation: mark-tick 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes mark-tick {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
    100% { box-shadow: 0 0 10px 5px transparent; }
  }
  .row-flash {
    border-radius: 8px;
    animation: row-flash 1.05s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes row-flash {
    0% { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 0 22px -6px color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 11%, transparent); }
    55% { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent), inset 0 0 18px -8px color-mix(in srgb, var(--accent) 22%, transparent); background: color-mix(in srgb, var(--accent) 4%, transparent); }
    100% { box-shadow: inset 0 0 0 1px transparent, inset 0 0 18px -8px transparent; background: transparent; }
  }

  /* value summary: the current choice for that section, right-aligned before
     the chevron, so closed sections still tell you what they configure. */
  .section-summary {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
    text-align: right;
    transition: color 0.15s ease;
  }
  .section-head:hover .section-summary { color: var(--text-2); }
  .section-chevron { font-family: var(--mono); font-size: 10px; color: var(--text-3); transition: transform 0.2s ease; flex: none; }
  .section.open .section-chevron { transform: rotate(90deg); }
  .section-body { padding: 2px 14px 12px; }

  .row { display: flex; align-items: center; gap: 8px 14px; min-height: 46px; padding: 9px 0; flex-wrap: wrap; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.04); }
  :root[data-theme="light"] .row + .row { border-top-color: rgba(10, 13, 20, 0.05); }
  /* Rows wrap as a last resort on narrow form factors; the label stays
     shrinkable so normal-width rows never wrap. Tight controls (segmented
     buttons) wrap internally instead — see .segmented below. */
  .row-label { font-size: 13px; color: var(--text); flex: 1 1 auto; min-width: 0; }
  .row-label small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-3); margin-top: 2px; }

  .value { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
  .value.led { color: var(--accent); }

  .switch {
    width: 30px; height: 17px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    position: relative;
    cursor: pointer;
    flex: none;
    transition: background 0.15s ease;
    border: none;
    padding: 0;
  }
  :root[data-theme="light"] .switch { background: rgba(10, 13, 20, 0.14); }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #cfd6e2;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .switch.on { background: var(--accent-soft); }
  .switch.on::after { transform: translateX(13px); background: var(--accent); box-shadow: 0 0 6px var(--accent-strong); }

  .segmented { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--glass-2); flex-wrap: wrap; max-width: 100%; }
  .segmented button {
    flex: 0 1 auto;
    min-width: 0;
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button.seg-active { background: var(--glass-1); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  .seg-selected { background: var(--accent-soft) !important; color: var(--accent) !important; box-shadow: inset 0 0 0 1px var(--accent-strong) !important; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .chip {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-2);
    background: rgba(255, 255, 255, 0.03);
    cursor: pointer;
  }
  .chip:hover { color: var(--text); }
  .chip.on { border-color: var(--accent); color: var(--led-strong); background: var(--accent-soft); }

  .slider-row { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 0; }
  .slider-head { display: flex; align-items: baseline; }
  .slider-head .value { margin-left: auto; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 999px;
    background: var(--hairline);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-strong);
    border: none;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }

  /* custom dropdown — a tiny island of its own, in the deck's visual
     language: glass blur, hairline, mono type, LED accent on the pick. */
  .notch-select { position: relative; }
  .ns-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
    min-width: 158px;
    max-width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--glass-2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.12s ease;
  }
  .ns-trigger:hover { border-color: var(--border-strong); }
  .ns-trigger[aria-expanded="true"] { border-color: var(--accent); }
  .ns-trigger .ns-value { overflow: hidden; text-overflow: ellipsis; }
  .ns-trigger .ns-chev { color: var(--text-3); font-size: 9px; flex: none; transition: transform 0.15s ease, color 0.15s ease; }
  .ns-trigger[aria-expanded="true"] .ns-chev { transform: rotate(90deg); color: var(--accent); }
  .ns-pop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 45;
    min-width: 100%;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(26, 28, 34, 0.97), rgba(18, 20, 26, 0.97));
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    padding: 5px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .ns-pop.up { top: auto; bottom: calc(100% + 6px); }
  :root[data-theme="light"] .ns-pop { background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 247, 251, 0.98)); }
  .ns-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  .ns-opt::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex: none;
    background: transparent;
    transition: background 0.12s ease, box-shadow 0.12s ease;
  }
  .ns-opt:hover { background: var(--glass-2); color: var(--text); }
  .ns-opt.on { color: var(--accent); }
  .ns-opt.on::before { background: var(--accent); box-shadow: 0 0 5px var(--accent-strong); }

  .settings-text-input {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--glass-2);
    color: var(--text);
    font-size: 11.5px;
    padding: 6px 10px;
    outline: none;
    width: 150px;
  }
  .settings-text-input:focus { border-color: var(--accent); }

  .swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; max-width: 100%; }
  .swatch {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .swatch.on { border-color: var(--text); box-shadow: 0 0 8px var(--accent-strong); }
  .swatch input[type="color"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: none; }

  .deck-foot {
    position: sticky;
    bottom: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 14px 14px;
    border-top: 1px solid var(--hairline);
    background: linear-gradient(180deg, rgba(21, 26, 36, 0.98), rgba(13, 17, 25, 0.99));
    box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.28);
  }
  .deck-foot-actions { display: flex; gap: 8px; }
  .deck-foot .text-btn { width: auto; flex: none; padding: 4px 2px; text-align: left; }
  :root[data-theme="light"] .deck-foot {
    background: linear-gradient(180deg, rgba(248, 250, 253, 0.98), rgba(240, 243, 248, 0.99));
    box-shadow: 0 -8px 20px rgba(10, 13, 20, 0.08);
  }

  .deck-foot-left { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .text-btn.danger, .text-btn.danger:hover { color: var(--alarm); }
  .text-btn.danger.armed { border-bottom: 1px solid currentColor; }

  /* small form factors: tighten the panel chrome so the deck keeps full rows */
  @media (max-width: 520px) {
    .deck-scroll { padding: 6px 10px 10px; }
    .deck-foot { padding: 12px 10px 14px; }
    .panel-head { padding: 10px 10px 8px; }
    .island-strip { padding: 0 12px; }
  }
  .btn {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 700; }
  .btn.primary:hover:not(:disabled) { background: var(--led-strong); }
  .btn.ghost { border-color: transparent; color: var(--text-3); }
  .btn.primary.bump { animation: apply-pulse 1.4s ease; }
  @keyframes apply-pulse { 30% { transform: scale(1.05); box-shadow: 0 0 18px var(--accent-strong); } }

  .text-btn {
    border: none;
    background: transparent;
    color: var(--text-3);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 14px 10px;
    width: 100%;
    text-align: center;
  }
  .text-btn:hover { color: var(--text-2); }

  /* ================= context menu ================= */
  .ctx-menu {
    position: fixed;
    z-index: 50;
    min-width: 160px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(24, 26, 32, 0.97), rgba(18, 20, 26, 0.97));
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    padding: 5px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  :root[data-theme="light"] .ctx-menu { background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 247, 251, 0.98)); }
  .ctx-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--text-2);
    font-size: 12px;
    cursor: pointer;
    text-align: left;
  }
  .ctx-item:hover { background: var(--glass-2); color: var(--text); }
  .ctx-item.danger { color: var(--alarm); }
  .ctx-item.danger:hover { background: rgba(255, 107, 107, 0.12); }

  /* ================= setup modal ================= */

  .modal-wrap {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 48px; /* fixed px — vh is circular under a window sized from this modal */
    background: rgba(5, 7, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  :root[data-theme="light"] .modal-wrap { background: rgba(20, 24, 34, 0.3); }
  .modal-wrap.open { display: flex; }
  /* App-only: no dimming scrim. The OS window is fitted to the modal, so the
     veil has nothing meaningful to dim — it just paints a dark rectangular
     frame around the wizard (reads as the "black box"). The desktop behind
     stays untouched; clicks on the margin still close the wizard. */
  :root.tauri .modal-wrap {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  /* Same for the modal's outer drop shadow: inside a window fitted to the
     modal (+16px), the 60px shadow fills the margin with near-black — a dark
     frame around the wizard. The border defines the edge; no shadow needed. */
  :root.tauri .modal {
    box-shadow: none;
  }
  /* The modal MUST NOT use viewport units (vw/vh): under Tauri the viewport is
     the OS window, which is sized FROM this modal's measured box — a circular
     dependency that collapses the wizard to a ~49px sliver at the app's
     380x58 boot window. A fixed px width and an unclamped natural height,
     measured by openSetup() before re-applying the scroll cap, size it
     deterministically at any window size. */
  .modal {
    width: 440px;
    flex: 0 0 auto; /* flex item inside .modal-wrap: don't shrink below the fixed width in a narrow window */
    overflow-y: auto;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel), var(--ink-2));
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    padding: 20px 20px 16px;
  }
  :root[data-theme="light"] .modal { background: linear-gradient(180deg, #ffffff, #f0f2f7); }
  .modal h1 { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .modal .sub { font-size: 11.5px; color: var(--text-3); margin: 4px 0 14px; line-height: 1.5; }
  .modal h2 {
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-3);
    margin: 14px 0 7px;
  }
  .setup-grid { display: flex; gap: 8px; }
  .setup-tile {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--glass-1);
    padding: 12px;
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .setup-tile:hover { border-color: var(--border-strong); }
  .setup-tile.on { border-color: var(--accent); background: var(--accent-soft); }
  .setup-tile strong { font-size: 12.5px; color: var(--text); }
  .setup-tile small { font-size: 10px; color: var(--text-3); line-height: 1.4; }
  .setup-preview {
    height: 26px;
    border-radius: 999px;
    background: var(--text);
    opacity: 0.85;
    margin-bottom: 4px;
    position: relative;
    /* .setup-tile is a column flex with align-items: flex-start, so an empty
       span with no width would collapse to 0 (the pill preview vanished).
       Give it a definite width: 70% centered, same as the notch tile. */
    width: 70%;
    margin: 0 auto 8px;
  }
  .setup-preview.notch { border-radius: 0 0 18px 18px; height: 18px; width: 70%; margin: 0 auto 8px; }
  .setup-actions { display: flex; gap: 8px; margin-top: 18px; }

  /* Reduced-motion class — kept for completeness; the app never adds it, so
     every animation always plays regardless of the Windows "Animation
     effects" accessibility setting. */
  body.reduce-motion *,
  body.reduce-motion *::before,
  body.reduce-motion *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
</style>
