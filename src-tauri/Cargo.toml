[package]
name = "winotch"
version = "0.2.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# macOS-only: lift the menu-bar clamp so the island can hug the absolute top
# edge like real notch hardware (see src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"

# Windows-only: System Media Transport Controls (SMTC) media session access,
# plus the registry + message-box APIs used by the WebView2 Runtime self-install.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

# Vendored webview2-com-sys patched to statically link WebView2Loader on the
# GNU toolchain too (see vendor/webview2-com-sys), so the release exe needs no
# companion DLLs.
[patch.crates-io]
webview2-com-sys = { path = "vendor/webview2-com-sys" }

