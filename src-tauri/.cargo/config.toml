# Statically link the CRT and unwind runtime for the Windows GNU/llvm-mingw
# cross-builds so the release exe runs on stock Windows with no companion
# DLLs (no libunwind.dll, libgcc, or libwinpthread). The static libunwind.a
# itself is committed in src-tauri/static and wired up from build.rs via a
# rustc-link-search, so no machine-specific paths are needed here.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]
