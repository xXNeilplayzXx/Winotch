      { device: "\\.\DISPLAY1", name: "DELL U2723QE", is_primary: true, x: 0, y: 0, width: 2560, height: 1440 },

<script>
/* Winotch layout regression test - opt-in, dormant in normal use.
 *
 * Run:   preview.html?test=1       audit + manual step-through showcase
 *        preview.html?test=auto    audit + auto-advancing showcase
 *
 * The audit clones the rendered island into 4 mock viewports (one per
 * shape/mode combo) and measures the positioning contract (flush top,
 * horizontal centering, size, transform-origin, clipping, zero margins, GPU
 * hints, per-shape radius), then renders a report table and a labeled visual
 * contact sheet. The live island is left untouched; the showcase only
 * highlights specimens. A self-cycling morph demo at the bottom of the
 * report demonstrates the spring width\/height\/radius tween.           */
(() => {
  if (!new URLSearchParams(location.search).has("test")) return;
  var AUTO = /auto/i.test(new URLSearchParams(location.search).get("test") || "");

  var COMBOS = [
    { shape: "shape-notch", mode: "mode-collapsed", label: "NOTCH \u00b7 COLLAPSED", radius: { top: 0, bottom: 22 }, size: { w: 256, h: 36 } },      { shape: "shape-notch", mode: "mode-expanded", label: "NOTCH \u00b7 EXPANDED", radius: { top: 0, bottom: 30 }, size: { w: 460, h: null, collapseH: 36 } },
    { shape: "shape-pill", mode: "mode-collapsed", label: "PILL \u00b7 COLLAPSED", radius: { pill: true }, size: { w: 330, h: 36 } },      { shape: "shape-pill", mode: "mode-expanded", label: "PILL \u00b7 EXPANDED", radius: { pill: true, expanded: true }, size: { w: 460, h: null, collapseH: 36 } },
  ];

  var settle = [];
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var $ = function (s) { return document.querySelector(s); };
  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  function injectStyles() {
    var st = el("style");
    st.textContent = [
      "body{display:block!important;overflow-y:auto!important;background:#101014!important}",
      "#nt-report{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e8e8e8;padding:8px 28px 52px}",
      "#nt-report h1{font-size:20px;margin:22px 0 4px}",
      "#nt-report .nt-sub{color:#9aa0a8;font-size:12px;margin:0 0 14px}",
      "#nt-report .nt-verdict{font-size:14px;font-weight:700;margin:0 0 6px}",
      "#nt-report h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9aa0a8;margin:26px 0 10px}",
      "#nt-report table{border-collapse:collapse;font-size:11.5px}",
      "#nt-report th,#nt-report td{border:1px solid #2a2d33;padding:5px 9px;text-align:left;white-space:nowrap}",
      "#nt-report th{background:#17191d;color:#c9cede;font-weight:600}",
      "#nt-report .pass{color:#34d399;font-weight:700}",
      "#nt-report .fail{color:#ff9b9b;font-weight:700}",
      "#nt-report .nt-note{color:#6b7280;font-size:11.5px;margin:14px 0 0}",
      ".nt-cell{display:flex;flex-direction:column;align-items:stretch}",
      ".nt-cap{font-size:11px;letter-spacing:.12em;color:#9aa0a8;margin:0 0 6px;text-align:center}",
      ".nt-stage{position:relative;width:520px;height:560px;margin:0 auto 4px;background:#101014;overflow:hidden;border:1px solid #26282d;border-radius:6px}",
      ".nt-stage.nt-active{outline:3px solid #e9b949;outline-offset:3px}",
      "#nt-sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:1240px;padding:0}",
      "#nt-sheet .island-shell{width:100%;height:100%}",
      "#nt-sheet .island,#nt-sheet .island *{animation:none!important;transition:none!important}",
      "#nt-report .nt-morph-stage .island{animation:none!important}",
    ].join("\n");
    document.head.appendChild(st);
  }

  function audit(island, combo, viewport) {
    var r = island.getBoundingClientRect();
    var sr = viewport.getBoundingClientRect();
    var cs = getComputedStyle(island);
    var origin = cs.transformOrigin.split(" ").map(function (v) { return parseFloat(v); });
    var will = cs.willChange.split(",").map(function (s) { return s.trim(); });
    var rad = [cs.borderTopLeftRadius, cs.borderTopRightRadius, cs.borderBottomLeftRadius, cs.borderBottomRightRadius].map(function (v) { return parseFloat(v); });
    var leftGap = r.left - sr.left, rightGap = sr.right - r.right;
    var marginOk = ["marginTop", "marginRight", "marginBottom", "marginLeft"].every(function (p) { return cs[p] === "0px"; });
    var overflowOk = cs.overflow === "hidden" || (cs.overflowX === "hidden" && cs.overflowY === "hidden");
    var radiusOk = combo.radius.pill
      ? (combo.radius.expanded
          ? rad.every(function (v) { return Math.abs(v - 32) <= 1; })
          : rad.every(function (v) { return v >= 999; }))
      : rad[0] === 0 && rad[1] === 0 && Math.abs(rad[2] - combo.radius.bottom) <= 1 && Math.abs(rad[3] - combo.radius.bottom) <= 1;
    var sizeOk = combo.size.h != null
      ? Math.abs(r.width - combo.size.w) <= 2 && Math.abs(r.height - combo.size.h) <= 2
      : Math.abs(r.width - combo.size.w) <= 2 && r.height >= combo.size.collapseH + 60;
    var checks = {
      "size": { ok: sizeOk, actual: Math.round(r.width) + "\u00d7" + Math.round(r.height), expect: combo.size.h != null ? combo.size.w + "\u00d7" + combo.size.h : combo.size.w + "\u00d7 >" + (combo.size.collapseH + 60) },
      "flush top": { ok: Math.abs(r.top - sr.top) <= 1, actual: (r.top - sr.top).toFixed(2) + "px", expect: "0px" },
      "centered": { ok: Math.abs(leftGap - rightGap) <= 1, actual: (leftGap - rightGap).toFixed(2) + "px", expect: "0px\u0394" },
      "transform-origin": { ok: Math.abs(origin[0] - r.width / 2) <= 1 && origin[1] === 0, actual: cs.transformOrigin, expect: (r.width / 2).toFixed(0) + "px 0px" },
      "overflow hidden": { ok: overflowOk, actual: cs.overflow, expect: "hidden" },
      "margin 0": { ok: marginOk, actual: cs.margin, expect: "0px 0px 0px 0px" },
      "will-change": { ok: ["transform", "width", "height"].every(function (t) { return will.indexOf(t) !== -1; }), actual: cs.willChange, expect: "transform, width, height" },
      "backface hidden": { ok: cs.backfaceVisibility === "hidden" && (cs.webkitBackfaceVisibility === undefined || cs.webkitBackfaceVisibility === "hidden"), actual: cs.backfaceVisibility, expect: "hidden" },
      ["radius " + (combo.radius.pill ? (combo.radius.expanded ? "pill-expanded" : "pill") : "notch")]: { ok: radiusOk, actual: rad[0] + "/" + rad[1] + "/" + rad[2] + "/" + rad[3], expect: combo.radius.pill ? (combo.radius.expanded ? "32px all" : "pill\u2265999 all") : "0/0/" + combo.radius.bottom + "/" + combo.radius.bottom },
    };
    var keys = Object.keys(checks);
    return {
      label: combo.label, shape: combo.shape, mode: combo.mode,
      ok: keys.every(function (k) { return checks[k].ok; }),
      checks: keys.map(function (k) { return { name: k, ok: checks[k].ok, actual: checks[k].actual, expect: checks[k].expect }; }),
      box: { w: Math.round(r.width), h: Math.round(r.height), topOff: +(r.top - sr.top).toFixed(2), centerDelta: +(leftGap - rightGap).toFixed(2) },
    };
  }

  function auditKeyframes() {
    var result = { name: "@keyframes island-in", ok: false, actual: "rule not found", expect: "0% frame scales, no translate" };
    var i, sheet, rules, rule, frame, tf;
    for (i = 0; i < document.styleSheets.length; i++) {
      sheet = document.styleSheets[i];
      try { rules = sheet.cssRules; } catch (e) { continue; }
      for (var j = 0; rules && j < rules.length; j++) {
        rule = rules[j];
        if (!rule || rule.name !== "island-in" || !rule.cssRules) continue;
        frame = null;
        for (var k = 0; k < rule.cssRules.length; k++) {
          if (String(rule.cssRules[k].keyText || "").indexOf("0%") !== -1) { frame = rule.cssRules[k]; break; }
        }
        if (!frame) break;
        tf = (frame.style && (frame.style.transform || frame.style.webkitTransform)) || "(no transform)";
        result.actual = tf;
        result.ok = tf.indexOf("scale") !== -1 && tf.toLowerCase().indexOf("translate") === -1;
        return result;
      }
    }
    return result;
  }

  function auditShell(shell) {
    var cs = getComputedStyle(shell);
    var ok = cs.display === "flex" && cs.justifyContent === "center" && cs.alignItems === "flex-start";
    return { name: ".island-shell centering", ok: ok, actual: cs.display + " / " + cs.justifyContent + " / " + cs.alignItems, expect: "flex / center / flex-start" };
  }

  function auditMorph(island) {
    var cs = getComputedStyle(island);
    var props = (cs.transitionProperty || "").split(",").map(function (t) { return t.trim(); });
    var supports = typeof CSS !== "undefined" && CSS.supports("interpolate-size", "allow-keywords");
    var ok = props.indexOf("width") !== -1 && props.indexOf("height") !== -1 && props.indexOf("border-radius") !== -1;
    return {
      name: "spring width/height morph",
      ok: ok,
      actual: (cs.transitionProperty || "none") + " \u00b7 interpolate-size:" + (supports ? "yes" : "NO"),
      expect: "width, height, border-radius \u00b7 cubic-bezier(.34,1.56,.64,1) \u00b7 interpolate-size:yes",
    };
  }

  function startMorph(island, api) {
    var wrap = el("div");
    wrap.appendChild(el("h2", null, "Spring morph demo \u2014 auto-cycling notch"));
    var stage = el("div", "nt-stage nt-morph-stage");
    var shell = el("div", "island-shell");
    var clone = island.cloneNode(true);
    clone.removeAttribute("style");
    var base = island.className.split(" ").filter(function (c) { return c !== "shape-notch" && c !== "shape-pill" && c !== "mode-collapsed" && c !== "mode-expanded"; });
    clone.className = base.concat(["shape-notch", "mode-collapsed"]).join(" ");
    shell.appendChild(clone);
    stage.appendChild(shell);
    wrap.appendChild(stage);
    wrap.appendChild(el("p", "nt-show-status", "Morph demo \u2014 toggles collapsed\/expanded every 2s so you can watch the spring tween (width + height + radius)."));
    document.getElementById("nt-report").appendChild(wrap);
    var expanded = false;
    function toggle() {
      expanded = !expanded;
      clone.classList.toggle("mode-expanded", expanded);
      clone.classList.toggle("mode-collapsed", !expanded);
    }
    setInterval(toggle, 2000);
    api.morphToggle = toggle;
    return clone;
  }

  function buildSheet(island) {
    var sheet = el("div");
    sheet.id = "nt-sheet";
    COMBOS.forEach(function (combo, idx) {
      var cell = el("div", "nt-cell");
      cell.appendChild(el("p", "nt-cap", (idx + 1) + ". " + combo.label));
      var stage = el("div", "nt-stage");
      stage.dataset.ntState = combo.label;
      var shell = el("div", "island-shell");
      var clone = island.cloneNode(true);
      clone.removeAttribute("style");
      var base = island.className.split(" ").filter(function (c) { return c !== "shape-notch" && c !== "shape-pill" && c !== "mode-collapsed" && c !== "mode-expanded"; });
      clone.className = base.concat([combo.shape, combo.mode]).join(" ");
      shell.appendChild(clone);
      stage.appendChild(shell);
      cell.appendChild(stage);
      sheet.appendChild(cell);
    });
    return sheet;
  }

  function renderReport(rows, kf, shellCheck, morph, island, sheetEl) {
    var report = el("div", "nt-report-wrap");
    report.id = "nt-report";
    report.appendChild(el("h1", null, "Winotch layout regression test"));
    report.appendChild(el("p", "nt-sub", "preview.html?test=1 \u00b7 4 states \u00d7 9 assertions each \u00b7 specimens cloned from the live island"));
    var passed = rows.filter(function (r) { return r.ok; }).length;
    report.appendChild(el("p", "nt-verdict " + (passed === rows.length ? "pass" : "fail"),
      (passed === rows.length ? "\u2713 ALL " + rows.length + " STATES PASS" : "\u2717 " + (rows.length - passed) + "/" + rows.length + " STATES FAILING") +
      (island ? " \u00b7 island " + Math.round(island.getBoundingClientRect().width) + "\u00d7" + Math.round(island.getBoundingClientRect().height) + " at top " + Math.round(island.getBoundingClientRect().top) + "px" : "")));

    report.appendChild(el("h2", null, "Geometry audit"));
    var table = el("table");
    var head = el("thead");
    var hr = el("tr");
    ["State", "Box", "Top off", "Center \u0394", "Origin", "Overflow", "Margin", "Will-change", "Backface", "Radius TL/TR/BL/BR", "Result"].forEach(function (c) { hr.appendChild(el("th", null, c)); });
    head.appendChild(hr);
    table.appendChild(head);
    var body = el("tbody");
    rows.forEach(function (row) {
      var tr = el("tr");
      tr.appendChild(el("td", null, row.label));
      tr.appendChild(el("td", null, row.box.w + "\u00d7" + row.box.h));
      var byName = {};
      row.checks.forEach(function (c) { byName[c.name] = c; });
      tr.appendChild(el("td", "num", byName["flush top"].actual));
      tr.appendChild(el("td", "num", byName["centered"].actual));
      tr.appendChild(el("td", "num", byName["transform-origin"].actual));
      tr.appendChild(el("td", "num", byName["overflow hidden"].actual));
      tr.appendChild(el("td", "num", byName["margin 0"].actual));
      tr.appendChild(el("td", "num", byName["will-change"].actual));
      tr.appendChild(el("td", "num", byName["backface hidden"].actual));
      var radiusCheck = row.checks.filter(function (c) { return c.name.indexOf("radius ") === 0; })[0];
      tr.appendChild(el("td", "num", radiusCheck ? radiusCheck.actual : ""));
      tr.appendChild(el("td", row.ok ? "pass" : "fail", row.ok ? "PASS" : "FAIL"));
      body.appendChild(tr);
    });
    table.appendChild(body);
    report.appendChild(table);

    report.appendChild(el("h2", null, "Global checks"));
    var g = el("table");
    var gh = el("thead"); var ghr = el("tr");
    ["Check", "Actual", "Expected", "Result"].forEach(function (c) { ghr.appendChild(el("th", null, c)); });
    gh.appendChild(ghr); g.appendChild(gh);
    var gb = el("tbody");
    [shellCheck, kf, morph].forEach(function (c) {
      var tr = el("tr");
      tr.appendChild(el("td", null, c.name));
      tr.appendChild(el("td", "num", c.actual));
      tr.appendChild(el("td", null, c.expect));
      tr.appendChild(el("td", c.ok ? "pass" : "fail", c.ok ? "PASS" : "FAIL"));
      gb.appendChild(tr);
    });
    g.appendChild(gb);
    report.appendChild(g);
    report.appendChild(el("p", "nt-note", "Press Enter, click outside an island, or call window.__notchTest.next() to step the visual showcase below. Each state row measures a specimen cloned from the rendered island inside its own mock viewport; screenshots are the visual evidence."));

    report.appendChild(el("h2", null, "Contact sheet \u2014 all 4 states (clones of the rendered island)"));
    var sheet = sheetEl || buildSheet(island);
    report.appendChild(sheet);
    report.appendChild(el("p", "nt-show-status", ""));
    document.body.appendChild(report);
    return report;
  }

  var api = {
    version: 1,
    auto: AUTO,
    reportReady: false,
    done: false,
    results: null,
    current: function () { return show.idx; },
    next: function () { show.advance(); },
  };
  window.__notchTest = api;

  var show = {
    idx: 0,
    done: false,
    timer: null,
    advance: function () {
      if (show.done) { api.done = true; return; }
      var stages = document.querySelectorAll(".nt-stage");
      if (!stages.length) { show.done = true; api.done = true; return; }
      var i;
      for (i = 0; i < stages.length; i++) stages[i].classList.toggle("nt-active", i === show.idx);
      stages[show.idx].scrollIntoView({ behavior: "smooth", block: "center" });
      var cap = document.querySelector("#nt-report .nt-show-status");
      if (cap) cap.textContent = "Visual showcase \u2014 " + (show.idx + 1) + "/" + stages.length + "  (" + COMBOS[show.idx].label.toLowerCase() + ")" + (AUTO ? " \u00b7 auto" : " \u00b7 click / Enter / __notchTest.next() to advance");
      show.idx++;
      if (show.idx >= stages.length) {
        show.done = true;
        api.done = true;
        if (cap) cap.textContent = "Visual showcase complete \u2014 all " + stages.length + " states verified above.";
        return;
      }
      if (AUTO) show.timer = setTimeout(show.advance, 1600);
    },
  };

  document.addEventListener("click", function (e) { if (!e.target.closest(".island")) show.advance(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show.advance(); }
  });

  (async function run() {
    injectStyles();
    var island = null;
    for (var t = 0; t < 100 && !island; t++) {
      island = $(".island");
      if (!island) await sleep(50);
    }
    var reportEl = document.getElementById("nt-report");
    if (!island) {
      var err = el("div", "nt-report-wrap");
      err.id = "nt-report";
      err.appendChild(el("h1", "fail", "\u2717 test aborted \u2014 .island not found (app did not mount)"));
      document.body.appendChild(err);
      api.reportReady = true;
      return;
    }

    // Build the 4 specimens (clones of the live island) and audit each inside
    // its own mock viewport stage. The live island itself is never mutated:
    // its box is driven by the app's mocked window sizing, so the static CSS
    // contract is verified on the specimens.
    var sheet = buildSheet(island);
    document.body.appendChild(sheet);
    var stages = sheet.querySelectorAll(".nt-stage");
    var rows = [];
    COMBOS.forEach(function (combo, i) {
      rows.push(audit(stages[i].querySelector(".island"), combo, stages[i]));
    });

    var kf = auditKeyframes();
    var shellCheck = auditShell(island.parentElement);
    var morph = auditMorph(island);
    renderReport(rows, kf, shellCheck, morph, island, sheet);
    startMorph(island, api);

    api.results = {
      rows: rows.map(function (r) { return { label: r.label, ok: r.ok, box: r.box }; }),
      passed: rows.filter(function (r) { return r.ok; }).length,
      total: rows.length,
      keyframes: kf,
      shell: shellCheck,
    };
    api.reportReady = true;
    if (AUTO) show.timer = setTimeout(show.advance, 600);
  })();
})();
</script>
</body>
</html>
